<!doctype html>
<html lang="en">

<style>
:root {
  --bg: #F4F0FF;
  --card: #FFFFFF;
  --soft: #ECE6FF;
  --ink: #1A1033;
  --edge: #1A1033;
  --drop: #1A1033;
  --sub: #5B4F7A;
  --faint: #8C80AD;
  --grape: #7C4DFF;
  --on-grape: #FFFFFF;
  --volt: #D4FF3A;
  --pink: #FF5FA2;
  --pink-ink: #C2185B;
  --sun: #FFC93C;
  --danger: #E5326B;
  --danger-soft: #FFE1EC;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #140B2A; --card: #21153F; --soft: #2C1D54; --ink: #F4F0FF; --edge: #B9A8F5; --drop: #05010F;
    --sub: #C3B8E6; --faint: #8C80AD; --grape: #9B78FF; --on-grape: #12082A; --pink: #FF7AB4; --pink-ink: #FF9CC8;
    --danger: #FF6B95; --danger-soft: #3E1530;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--soft) 1.4px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; min-height: 100vh;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(44px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(28px, 7.4vw, 46px); line-height: 1.04; font-weight: 800; text-wrap: balance; overflow-wrap: break-word; hyphens: manual; }
h2 { font-size: 22px; font-weight: 800; line-height: 1.15; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--sub); }
.small { font-size: 14px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

.sticker { background: var(--card); border: 2.5px solid var(--edge); border-radius: var(--r-lg); box-shadow: 5px 5px 0 var(--drop); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; font-weight: 800; background: var(--grape); color: var(--on-grape); border: 2.5px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); white-space: nowrap; transition: transform 0.08s ease, box-shadow 0.08s ease; }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--drop); }
.btn.alt { background: var(--card); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.small { min-height: 42px; padding: 0 16px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.field { width: 100%; min-height: 52px; border-radius: var(--r-md); border: 2.5px solid var(--edge); background: var(--card); padding: 0 16px; }
.field::placeholder { color: var(--faint); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 180px; min-width: 0; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
.logo img { width: 36px; height: 36px; border-radius: 11px; border: 2.5px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); transform: rotate(-6deg); }
.install { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--sun); color: #1A1033; border: 2.5px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); font-weight: 800; font-size: 14px; transition: transform 0.08s, box-shadow 0.08s; }
.install:active { transform: translate(3px, 3px); box-shadow: none; }
.install svg { width: 16px; height: 16px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.install.help { background: var(--card); color: var(--ink); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: st; }
.steps li { position: relative; padding: 2px 0 2px 44px; min-height: 32px; counter-increment: st; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #1A1033; border: 2px solid var(--edge); font-family: var(--display); font-weight: 800; }
.steps li.done::before { content: "✓"; background: var(--volt); }
.steps li.done { color: var(--sub); }
.steps b { font-weight: 800; }
.tip { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--sub); font-weight: 600; background: var(--soft); border-radius: 12px; padding: 8px 12px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 2.5px solid var(--edge); }
.tabs button { flex: 1; min-height: 40px; border-radius: 999px; font-weight: 800; font-size: 14px; color: var(--sub); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

.hero { position: relative; padding: 22px 20px 20px; display: grid; gap: 16px; overflow: hidden; }
.hero-top { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.art { width: 86px; height: auto; margin: -4px -6px 0 0; cursor: pointer; }
@media (min-width: 560px) { .art { width: 170px; } .hero { padding: 26px 26px 22px; } }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 2px solid var(--edge); font-size: 14px; font-weight: 700; background: var(--soft); }
.tag.y { background: var(--sun); color: #1A1033; }

.battery { display: flex; align-items: center; }
.cell { position: relative; flex: 1; height: 54px; border: 2.5px solid var(--edge); border-radius: 16px; background: var(--card); overflow: hidden; padding: 4px; }
.fill { display: block; height: 100%; border-radius: 10px; background: repeating-linear-gradient(-45deg, var(--volt) 0 14px, #C3F02C 14px 28px); border: 2px solid #1A1033; min-width: 0; transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
.fill.zero { border: 0; }
.blabel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--ink); }
.blabel b { background: var(--card); color: var(--ink); padding: 2px 12px; border-radius: 999px; border: 2px solid var(--edge); }
.nub { width: 9px; height: 22px; background: var(--edge); border-radius: 0 6px 6px 0; }

.how { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-md); background: var(--volt); color: #1A1033; border: 2.5px solid var(--edge); font-weight: 600; }
.how .em { font-size: 26px; line-height: 1; flex: none; }

.sec { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; margin: 6px 2px -6px; }
.sec span { font-size: 14px; color: var(--sub); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.stat { text-align: left; display: grid; gap: 10px; padding: 16px; transition: transform 0.08s, box-shadow 0.08s; }
.stat:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--drop); }
.stat[aria-pressed="true"] { background: var(--pink); color: #1A1033; }
.stat[aria-pressed="true"] .hint, .stat[aria-pressed="true"] .count small { color: #1A1033; }
.stat .name { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.count { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.count small { font-size: 16px; color: var(--sub); font-weight: 700; }
.bar { height: 14px; border-radius: 999px; border: 2px solid var(--edge); background: var(--soft); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--volt); border-right: 2px solid var(--edge); transition: width 0.6s ease; }
.bar > span.zero { border: 0; }
.hint { font-size: 14px; font-weight: 700; color: var(--pink-ink); }
.hint.ok { color: var(--sub); }

.tools { display: grid; gap: 12px; scroll-margin-top: 14px; }
.search { position: relative; display: block; }
.search input { padding-left: 48px; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--sub); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 2.5px solid var(--edge); background: var(--card); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--sub); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.filterbar { display: flex; gap: 10px; align-items: center; padding: 8px 8px 8px 16px; border-radius: var(--r-md); background: var(--pink); color: #1A1033; border: 2.5px solid var(--edge); font-weight: 800; }

.list { display: grid; gap: 16px; }
.fam { position: relative; display: grid; gap: 14px; padding: 16px; }
.fam.complete { background: linear-gradient(var(--card), var(--card)) padding-box; }
.fam-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.avatar { width: 46px; height: 46px; border-radius: 14px; border: 2.5px solid var(--edge); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; flex: none; color: #1A1033; }
.fam-name { font-family: var(--display); font-size: 21px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; letter-spacing: -0.02em; }
.fam-lot { color: var(--sub); font-size: 14px; font-weight: 600; }
.score { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--edge); background: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.done-sticker { font-family: var(--display); font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: var(--sun); color: #1A1033; border: 2.5px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); transform: rotate(4deg); white-space: nowrap; }
.ticks { display: flex; flex-wrap: wrap; gap: 10px; }
.tick { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 0 8px; border-radius: 999px; border: 2.5px solid var(--edge); background: var(--card); font-weight: 700; font-size: 15px; box-shadow: 3px 3px 0 var(--drop); transition: transform 0.08s, box-shadow 0.08s, background 0.15s; text-align: left; }
.tick:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--drop); }
.tick .box { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--edge); display: grid; place-items: center; flex: none; background: var(--card); }
.tick .box svg { width: 17px; height: 17px; opacity: 0; transform: scale(0.3) rotate(-20deg); transition: opacity 0.15s, transform 0.3s cubic-bezier(0.3, 1.8, 0.5, 1); }
.tick[aria-pressed="true"] { background: var(--volt); color: #1A1033; border-color: #1A1033; }
.tick[aria-pressed="true"] .box { background: #1A1033; border-color: #1A1033; color: var(--volt); }
.tick[aria-pressed="true"] .box svg { opacity: 1; transform: none; }
.updated { font-size: 13px; color: var(--faint); font-weight: 600; }

.empty { text-align: center; padding: 32px 18px; display: grid; gap: 8px; justify-items: center; }
.empty .icon { font-size: 44px; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--sub); font-size: 14px; font-weight: 600; padding: 4px 2px; }
.live { display: inline-flex; align-items: center; gap: 8px; }
.live i { width: 10px; height: 10px; border-radius: 50%; background: #2BD46A; border: 2px solid var(--edge); animation: blink 2.4s infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.linkbtn { color: var(--ink); font-weight: 800; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; padding: 8px 0; }

.admin { display: grid; gap: 18px; padding: 0; overflow: hidden; scroll-margin-top: 14px; }
.admin-h { background: var(--grape); color: var(--on-grape); padding: 16px 18px; border-bottom: 2.5px solid var(--edge); display: grid; gap: 2px; }
.admin-h p { font-size: 14px; opacity: 0.9; font-weight: 600; }
.admin-body { display: grid; gap: 22px; padding: 0 18px 18px; }
.admin-sec { display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: var(--r-md); background: var(--soft); border: 2px solid var(--edge); flex-wrap: wrap; }
.item .grow { overflow-wrap: anywhere; }
.item input.field { min-height: 42px; border-width: 2px; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--edge); flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.del { color: var(--danger); }
textarea.field { min-height: 120px; padding: 12px 16px; resize: vertical; line-height: 1.5; }
.link-box { overflow-wrap: anywhere; background: var(--soft); padding: 12px 14px; border-radius: var(--r-md); border: 2px dashed var(--edge); font-size: 14px; font-weight: 600; }
details summary { list-style: none; }
details summary::-webkit-details-marker { display: none; }

.sheet-bg { position: fixed; inset: 0; background: rgba(20, 11, 42, 0.5); display: grid; align-items: end; justify-items: center; z-index: 20; padding: 16px; animation: fade 0.2s ease; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 22px; display: grid; gap: 14px; animation: up 0.25s ease; margin-bottom: env(safe-area-inset-bottom); }
.sheet > .btn:last-child { position: sticky; bottom: 0; box-shadow: 3px 3px 0 var(--drop), 0 -14px 14px var(--card); }
.sheet ol { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.sheet .ico { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); border: 2px solid var(--edge); vertical-align: middle; margin: 0 2px; }
.sheet .ico svg { width: 16px; height: 16px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(180%); background: var(--ink); color: var(--card); padding: 12px 20px; border-radius: 999px; font-weight: 800; border: 2.5px solid var(--edge); box-shadow: 4px 4px 0 var(--pink); transition: transform 0.25s cubic-bezier(.2,1.4,.4,1), visibility 0.25s; visibility: hidden; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
.loading { display: grid; gap: 16px; }
.skel { height: 120px; border-radius: var(--r-lg); border: 2.5px solid var(--soft); background: var(--card); animation: blink 1.2s infinite; }
.confetti { position: fixed; width: 10px; height: 14px; border-radius: 3px; border: 1.5px solid #1A1033; pointer-events: none; z-index: 40; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"><div class="loading" aria-label="Loading"><div class="skel" style="height:190px"></div><div class="skel"></div><div class="skel"></div></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheet"></div>

<script type="module">
import { firebaseConfig } from './config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, writeBatch, deleteField } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
getRedirectResult(auth).catch(() => {});

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

const cid = new URLSearchParams(location.search).get('c');
if (!cid && store.get('lastChecklist')) location.replace('?c=' + store.get('lastChecklist'));

const state = { list: null, families: [], user: null, admin: false, adminOpen: false, filter: null, view: 'all', q: '', confirm: null, error: null, loaded: false, bulkOpen: false };
const $app = document.getElementById('app');
const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>',

  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};
const ART = `<svg class="art" viewBox="0 0 170 140" aria-hidden="true">
  <path d="M0 46 Q 52 70 104 30" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 58 Q 50 84 104 42" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/>
  <path d="M146 30 Q 158 40 170 38" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/>
  <rect x="118" y="8" width="13" height="132" rx="3" fill="#8C80AD" stroke="var(--edge)" stroke-width="3"/>
  <rect x="98" y="24" width="54" height="11" rx="4" fill="#8C80AD" stroke="var(--edge)" stroke-width="3"/>
  <circle cx="106" cy="21" r="5" fill="var(--sun)" stroke="var(--edge)" stroke-width="3"/>
  <circle cx="144" cy="21" r="5" fill="var(--sun)" stroke="var(--edge)" stroke-width="3"/>
  <path d="M6 138 V96 L36 72 L66 96 V138 Z" fill="var(--pink)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/>
  <rect x="26" y="104" width="20" height="18" rx="3" fill="var(--volt)" stroke="var(--edge)" stroke-width="3"/>
  <path d="M62 138 V108 L86 89 L110 108 V138 Z" fill="var(--sun)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/>
  <rect x="78" y="114" width="16" height="24" rx="3" fill="var(--grape)" stroke="var(--edge)" stroke-width="3"/>
</svg>`;
const COLORS = ['#FFC93C', '#D4FF3A', '#FF8FC1', '#A98BFF', '#6EE7F9', '#FFA36B', '#8EF0B4', '#FDE68A'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 9);
const colorFor = (s) => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = (s) => String(s).trim().split(/\s+/).filter((w) => !/^(the|fam|family|pamilya)$/i.test(w)).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '•';
const millis = (t) => (t && t.toMillis ? t.toMillis() : typeof t === 'number' ? t : null);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const QUIPS = [
  'Walang iwanan sa block na ’to. 🤝',
  'Bayanihan, pero digital na. 📱',
  'Mas mabilis pa ’to sa chismis sa kanto. 🏃‍♀️',
  'Walang pila, walang papel, walang stress. ✌️',
  'Konting tick na lang, mga ka-block! 💪',
  'Sana all complete na. 🙏',
];
const quipSeed = Math.floor(Math.random() * QUIPS.length);
function quip(done, total) {
  if (!total) return 'Abangan ang mga ka-block! 👀';
  if (done === total) return 'Complete na lahat! Ang galing natin, mga ka-block! 🎉';
  if (done === 0) return 'Tara na, mga ka-block! Simulan na ang pag-tick. 💪';
  if (done / total >= 0.5) return 'Lagpas kalahati na tayo! Kaya pa ’yan. 🔥';
  return QUIPS[quipSeed];
}
const ZAPS = ['Bzzzt! ⚡ Sana lahat may sariling poste.', 'Huwag hawakan ang wire! ⚡😅', 'Poste: present! 🙋', 'Meralco pa more! 💡'];
function ago(t) {
  const m = millis(t);
  if (!m) return 'kanina lang';
  const s = Math.max(0, (Date.now() - m) / 1000);
  if (s < 60) return 'kanina lang';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' hr ago';
  if (s < 172800) return 'kahapon';
  return new Date(m).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

let toastTimer;

function confetti(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#D4FF3A', '#FFC93C', '#FF5FA2', '#7C4DFF', '#6EE7F9'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[i % colors.length];
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2;
    const d = 70 + Math.random() * 120;
    el.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 50}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: 0.6 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 90}px) rotate(${Math.random() * 900}deg)`, opacity: 0 },
    ], { duration: 1200 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => el.remove();
  }
}

async function signIn() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = e && e.code;
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment' || code === 'auth/web-storage-unsupported') {
      await signInWithRedirect(auth, provider);
    } else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') {
      toast('Hindi gumana ang sign-in. Try ulit. 🙏');
    }
  }
}

        <div class="row"><input id="newReq" class="field grow" placeholder="e.g. Water connection" maxlength="40" aria-label="New requirement"><button class="btn small" id="addReq">${I.plus}Add</button></div>
      </div>

      <div class="admin-sec">
        <h3>Families (${F.length})</h3>
        <p class="tip"><span>💡</span><span>I-type ang family name (at lot kung gusto), tap “Add”. ✏️ para i-edit, 🗑️ para i-delete. May mahabang listahan? Gamitin ang “sabay-sabay” sa baba.</span></p>
        ${F.map((f) => `<div class="item">
          <div class="grow"><b>${esc(f.name)}</b>${f.lot ? ` <span class="sub small">${esc(f.lot)}</span>` : ''}</div>
          ${c === 'f:' + f.id
            ? `<button class="btn small danger" data-delfam="${f.id}">Delete</button><button class="btn small alt" data-cancel="1">Huwag pala</button>`
            : `<button class="iconbtn" data-editfam="${f.id}" aria-label="Edit ${esc(f.name)}">${I.edit}</button><button class="iconbtn del" data-askfam="${f.id}" aria-label="Delete ${esc(f.name)}">${I.trash}</button>`}
        </div>`).join('') || '<p class="sub small">Wala pang families. I-add sila sa baba. 👇</p>'}
        <div class="row"><input id="famName" class="field" style="flex:1 1 100%" placeholder="Family name, e.g. Dela Cruz" maxlength="50" aria-label="Family name"><input id="famLot" class="field grow" placeholder="Lot o house no. (optional)" maxlength="20" aria-label="Lot"><button class="btn small" id="addFam">${I.plus}Add</button></div>
        <details id="bulkBox" ${state.bulkOpen ? 'open' : ''}>
          <summary class="linkbtn" style="cursor:pointer;display:inline-block">Mag-add ng maraming families sabay-sabay</summary>
          <div style="display:grid;gap:8px;margin-top:8px">
            <p class="sub small">Isang family kada line. Ilagay ang lot after ng comma kung gusto, e.g. <b>Santos, Lot 6</b></p>
            <textarea id="bulk" class="field" placeholder="Dela Cruz, Lot 5&#10;Santos, Lot 6&#10;Reyes, Lot 7" aria-label="Families, one per line"></textarea>
            <button class="btn small" id="addBulk">I-add lahat</button>
          </div>
        </details>
      </div>

      <div class="row" style="justify-content:flex-end"><button class="btn small alt" id="outBtn">Sign out</button></div>
    </div>
  </section>`;
}

function bind(shareUrl) {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn));
  const ib = document.getElementById('installBtn');
  if (ib) ib.onclick = install;
  on('.art', 'click', () => toast(pick(ZAPS)));
  const hb = document.getElementById('helpBtn');
  if (hb) hb.onclick = () => openGuide(state.admin || !cid || !state.list ? 'org' : 'fam');
  on('.tick', 'click', async (e) => {
    const b = e.currentTarget;
    const fam = state.families.find((f) => f.id === b.dataset.fam);
    const reqId = b.dataset.req;
    const now = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(now));
    const willComplete = now && fam && reqs().every((r) => r.id === reqId || has(fam, r));
    if (willComplete) { const rect = b.getBoundingClientRect(); confetti(rect.left + rect.width / 2, rect.top + rect.height / 2); }
    try {
      await updateDoc(doc(db, 'checklists', cid, 'families', b.dataset.fam), { ['ticks.' + reqId]: now ? true : deleteField(), updatedAt: serverTimestamp() });
      toast(willComplete ? pick([`${fam.name}, complete na! Sana all! 🎉`, `Petmalu! Complete na ang ${fam.name}! 🎉`, `${fam.name}, ang galing! Complete na! 🥳`]) : now ? pick(['Saved! Galing! ✓', 'Ayan, naka-save na ✓', 'Noted! ✓', 'G! Na-save na ✓', 'Check! ✅']) : pick(['Na-untick na', 'Okay, binawi na natin ’yan']));
    } catch (err) {
      b.setAttribute('aria-pressed', String(!now));
      toast('Hindi na-save. Check ang internet mo, tapos try ulit. 📶');
    }
  });
  on('.stat', 'click', (e) => {
    const id = e.currentTarget.dataset.filter;
    state.filter = state.filter === id ? null : id;
    if (state.filter) state.view = 'all';
    render();
    if (state.filter) document.querySelector('.tools').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  on('[data-view]', 'click', (e) => { state.view = e.currentTarget.dataset.view; state.filter = null; render(); });
  const cf = document.getElementById('clearFilter');
  if (cf) cf.onclick = () => { state.filter = null; render(); };
  const qi = document.getElementById('q');
  if (qi) qi.addEventListener('input', (e) => {
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    render(true);
    const again = document.getElementById('q');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });
  const signBtn = document.getElementById('adminSignIn');
  if (signBtn) signBtn.onclick = async () => {
    if (state.user) { await signOut(auth); toast('Signed out. Balik ka ha? 👋'); return; }
    store.set('openAdmin', '1');
    await signIn();
    setTimeout(() => { if (state.user && !state.admin) { store.set('openAdmin', ''); toast('Hindi ikaw ang organizer nito, ka-block. 😅'); } }, 1500);
  };
  const tog = document.getElementById('adminToggle');
  if (tog) tog.onclick = () => { state.adminOpen = !state.adminOpen; state.confirm = null; render(); if (state.adminOpen) document.querySelector('.admin').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  if (!(state.admin && state.adminOpen)) return;

  const listRef = doc(db, 'checklists', cid);
  const famRef = (id) => doc(db, 'checklists', cid, 'families', id);
  const safe = (fn) => async (...a) => { try { await fn(...a); } catch { toast('Hindi na-save. Check ang internet mo, tapos try ulit. 📶'); } };
  const saveReqs = (list) => updateDoc(listRef, { requirements: list, updatedAt: serverTimestamp() });
  const enter = (id, btnId) => { const el = document.getElementById(id); if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById(btnId).click(); } }); };
  enter('newReq', 'addReq');
  enter('famName', 'addFam');
  enter('famLot', 'addFam');
  enter('titleIn', 'saveTitle');

  document.getElementById('bulkBox').addEventListener('toggle', (e) => { state.bulkOpen = e.target.open; });
  document.getElementById('copyLink').onclick = () => copyText(shareUrl, 'Link copied! I-paste mo na sa GC. 📋');
  document.getElementById('copySummary').onclick = () => copyText(summaryText(shareUrl), 'Update copied! Paste na sa GC. 📣');
  const sl = document.getElementById('shareLink');
  if (sl) sl.onclick = () => navigator.share({ title: state.list.title, text: 'Paki-tick kung ano’ng meron na ang family niyo:', url: shareUrl }).catch(() => {});
  document.getElementById('saveTitle').onclick = safe(async () => {
    const el = document.getElementById('titleIn');
    const t = el.value.trim();
    if (!t) return;
    el.blur();
    await updateDoc(listRef, { title: t, updatedAt: serverTimestamp() });
    toast('Na-save ang pangalan ✓');
  });
  document.getElementById('addReq').onclick = safe(async () => {
    const el = document.getElementById('newReq');
    const name = el.value.trim();
    if (!name) { el.focus(); return; }
    el.value = '';
    el.blur();
    await saveReqs([...reqs(), { id: rid(), name }]);
    toast('Requirement added ✓');
  });
  on('[data-rename]', 'change', safe(async (e) => {
    const id = e.target.dataset.rename;
    const name = e.target.value.trim();
    if (!name) { render(); return; }
    await saveReqs(reqs().map((r) => (r.id === id ? { ...r, name } : r)));
    toast('Na-rename na ✓');
  }));
  on('[data-askreq]', 'click', (e) => { state.confirm = 'r:' + e.currentTarget.dataset.askreq; render(); });
  on('[data-askfam]', 'click', (e) => { state.confirm = 'f:' + e.currentTarget.dataset.askfam; render(); });
  on('[data-cancel]', 'click', () => { state.confirm = null; render(); });
  on('[data-delreq]', 'click', safe(async (e) => {
    const id = e.currentTarget.dataset.delreq;
    state.confirm = null;
    if (state.filter === id) state.filter = null;
    await saveReqs(reqs().filter((r) => r.id !== id));
    toast('Na-delete ang requirement');
  }));
  on('[data-delfam]', 'click', safe(async (e) => {
    state.confirm = null;
    await deleteDoc(famRef(e.currentTarget.dataset.delfam));
    toast('Na-delete ang family');
  }));
  on('[data-editfam]', 'click', (e) => {
    const f = state.families.find((x) => x.id === e.currentTarget.dataset.editfam);
    const item = e.currentTarget.closest('.item');
    item.innerHTML = `<input class="field grow" data-en="1" value="${esc(f.name)}" maxlength="50" aria-label="Family name"><input class="field" style="flex:1 1 110px;max-width:160px" data-el="1" value="${esc(f.lot || '')}" placeholder="Lot" maxlength="20" aria-label="Lot"><button class="btn small" data-es="1">Save</button>`;
    const nameIn = item.querySelector('[data-en]');
    nameIn.focus();
    const saveBtn = item.querySelector('[data-es]');
    saveBtn.addEventListener('mousedown', (ev) => ev.preventDefault());
    saveBtn.onclick = safe(async () => {
      const name = nameIn.value.trim();
      if (!name) return;
      const lot = item.querySelector('[data-el]').value.trim();
      if (document.activeElement) document.activeElement.blur();
      await updateDoc(famRef(f.id), { name, lot });
      toast('Na-save ✓');
      render();
    });
  });
  document.getElementById('addFam').onclick = safe(async () => {
    const n = document.getElementById('famName');
    const l = document.getElementById('famLot');
    const name = n.value.trim();
    if (!name) { n.focus(); return; }
    const lot = l.value.trim();
    n.value = '';
    l.value = '';
    n.blur();
    l.blur();
    await addDoc(collection(db, 'checklists', cid, 'families'), { name, lot, ticks: {}, order: Date.now(), updatedAt: serverTimestamp() });
    toast(`Welcome sa block, ${name}! 👋`);
  });
  document.getElementById('addBulk').onclick = safe(async () => {
    const box = document.getElementById('bulk');
    const lines = box.value.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) { box.focus(); return; }
    box.value = '';
    box.blur();
    const base = Date.now();
    for (let start = 0; start < lines.length; start += 400) {
      const batch = writeBatch(db);
      lines.slice(start, start + 400).forEach((l, i) => {
        const [name, ...rest] = l.split(',');
        batch.set(doc(collection(db, 'checklists', cid, 'families')), { name: name.trim().slice(0, 50), lot: rest.join(',').trim().slice(0, 20), ticks: {}, order: base + start + i, updatedAt: serverTimestamp() });
      });
      await batch.commit();
    }
    toast(`${plural(lines.length, 'family', 'families')} added. Ang dami! 🏘️`);
  });
  document.getElementById('outBtn').onclick = async () => { state.adminOpen = false; await signOut(auth); toast('Signed out. Balik ka ha? 👋'); };
}

let guided = false;
function firstVisitGuide() {
  if (guided || store.get('seenGuide')) return;
  guided = true;
  setTimeout(() => { if (!document.querySelector('.sheet')) openGuide(cid && state.list && !state.admin ? 'fam' : 'org'); }, 700);
}
const firstRender = setInterval(() => { if (state.loaded && !document.querySelector('.loading')) { clearInterval(firstRender); firstVisitGuide(); } }, 300);

setInterval(() => { if (state.families.some((f) => f.updatedAt)) render(); }, 60000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
</body>
</html>
