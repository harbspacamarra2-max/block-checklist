<style>

    --danger: #FF6B95; --danger-soft: #3E1530;
    color-scheme: dark;
  }
}
html.hc {
  --bg: #FFFFFF; --card: #FFFFFF; --soft: #EDEDED; --ink: #000000; --edge: #000000; --drop: #000000; --sub: #111111; --faint: #333333;

}

* { box-sizing: border-box; }

  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(110px, calc(env(safe-area-inset-bottom) + 96px)) max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;

.wrap { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }

const pesoShort = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '')}M` : n >= 1e4 ? `${(n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '')}K` : peso(n));
const fmtDate = (ms) => new Date(ms).toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
const lotSort = (lot) => { const m = String(lot || '').match(/\d+/); return m ? Number(m[0]) : 9999; };
const cmpHH = (a, b) => (a.block - b.block) || (lotSort(a.lot) - lotSort(b.lot)) || String(a.lot).localeCompare(String(b.lot), undefined, { numeric: true });
function ago(v) {
  const m = millis(v);
  if (!m) return t('justNow');
  const s = Math.max(0, (Date.now() - m) / 1000);
  if (s < 60) return t('justNow');
  if (s < 3600) return t('minAgo', Math.floor(s / 60));
  if (s < 86400) return t('hrAgo', Math.floor(s / 3600));
  if (s < 172800) return t('yesterday');
  return new Date(m).toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}

function confetti(x, y, amount = 30) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#D4FF3A', '#FFC93C', '#FF5FA2', '#7C4DFF', '#6EE7F9'];
  for (let i = 0; i < amount; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[i % colors.length];
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2;
    const d = 70 + Math.random() * 140;
    el.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 50}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: 0.6 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 90}px) rotate(${Math.random() * 900}deg)`, opacity: 0 },
    ], { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => el.remove();
  }
}

function duesCalc(paid, rate, start) {
  const P = paid || {};
  const now = ymNow();
  let behind = 0;
  for (let m = start, i = 0; m <= now && i < 1200; m = ymAdd(m, 1), i++) if (!P[m]) behind += 1;
  let m = start;
  for (let i = 0; P[m] && i < 1200; i++) m = ymAdd(m, 1);
  const until = m === start ? '' : ymAdd(m, -1);
  return { behind, until, ok: behind === 0, balance: behind * (Number(rate) || 0) };
}

function duesGrid(paid, start, editable, endYear) {
  const P = paid || {};
  const now = ymNow();
  const y0 = Number(start.slice(0, 4));
  const paidYears = Object.keys(P).filter((k) => P[k] && ymOk(k)).map((k) => Number(k.slice(0, 4)));
  const y1 = Math.max(Number(now.slice(0, 4)), Number(endYear) || 0, ...paidYears);
  const years = [];
  for (let y = y0; y <= y1; y++) years.push(y);
  const M = t('months');
  const rows = M.map((label, mi) => `<tr><th class="m" scope="row">${label}</th>${years.map((y) => {
    const ym = `${y}-${pad2(mi + 1)}`;
    if (ym < start) return '<td><span class="cell off" aria-hidden="true"></span></td>';
    const isPaid = !!P[ym];
    const cls = isPaid ? 'paid' : ym <= now ? 'due' : 'fut';
    const inner = isPaid ? '✓' : '';
    const label2 = `${label} ${y}: ${isPaid ? t('lgPaid') : ym <= now ? t('lgDue') : t('lgFut')}`;
    return editable
      ? `<td><button class="cell ${cls}" data-act="pay" data-v="${ym}" aria-label="${esc(label2)}" aria-pressed="${isPaid}">${inner}</button></td>`
      : `<td><span class="cell ${cls}" role="img" aria-label="${esc(label2)}">${inner}</span></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="gridwrap"><table class="dgrid"><thead><tr><th></th>${years.map((y) => `<th scope="col">’${String(y).slice(2)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--volt)"></i>${t('lgPaid')}</span><span><i style="background:var(--danger-soft);border-color:var(--danger)"></i>${t('lgDue')}</span><span><i style="border-style:dashed"></i>${t('lgFut')}</span></div>`;
}

function searchHH(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const m = norm(q).trim().match(/^(?:b|blk|block)?\.?\s*(\d+)\s*(?:[-/,.]|\s|l|lot)+\s*(\d+[a-z]?)$/);
  if (m) {
    const exact = state.hh.filter((x) => String(x.block) === String(Number(m[1])) && norm(x.lot) === norm(m[2]).replace(/^0+(?=\d)/, ''));
    if (exact.length) return exact;
  }
  return state.hh.filter((x) => {
    const hay = norm(`${x.name} blk ${x.block} lot ${x.lot} block ${x.block} ${x.block} ${x.lot} b${x.block} l${x.lot} blk${x.block} lot${x.lot} b${x.block}l${x.lot} ${x.block}-${x.lot} ${x.address || ''}`);
    return words.every((w) => hay.includes(w));
  });
}

    ${words.length ? (() => {

      return found.length ? found.slice(0, 60).map((x) => `<button class="lotbtn" data-act="openHH" data-v="${x.id}"><span class="lotno">${esc(x.block)}·${esc(x.lot)}</span><span class="lotname">${x.name ? esc(x.name) : t('blank')}<small>${esc(t('blkShort', x.block, x.lot))}</small></span><span></span></button>`).join('') : `<p class="sub small">${t('noMatch')}</p>`;
    })() : `<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(${wide ? 160 : 140}px,1fr))">${Array.from({ length: nB }, (_, i) => i + 1).map((b) => {

    lotsPane = `<div class="pane">
      ${crumbs('blocks', [['🏘️ ' + t('blocksH'), 'blocks'], [t('blockN', blk)]], true)}

        <input id="newName" class="field" placeholder="${esc(t('hhNamePh'))}" maxlength="80" aria-label="${esc(t('hhNamePh'))}" data-enter="saveNewHH">
        <div class="acts"><button class="btn small" data-act="saveNewHH" data-v="${blk}">${t('add')}</button><button class="btn small alt" data-act="cancelAdd">${t('cancel')}</button></div>
      </div>` : `<button class="btn small" data-act="startAdd">${t('addHH')}</button>`}
      <div class="stack">${lots.map((x) => lotRow(x, h && h.id === x.id)).join('') || `<p class="sub small">${t('noHH')}</p>`}</div>
    </div>`;
  }

  const cardPane = h ? cardHtml(h) : `<div class="placeholder">${blk ? t('pickLot') : t('pickBlock')}</div>`;

  if (wide) return `<div class="panes">${blocksPane}${lotsPane}<div class="pane">${cardPane}</div></div>`;
  if (h) return cardPane;
  if (blk) return lotsPane;
  return blocksPane;
}

function smsHref(phone, body) {
  return `sms:${String(phone).replace(/[^\d+]/g, '')}?&body=${encodeURIComponent(body)}`;
}

function periodCalc(paid, rate, months) {
  const P = paid || {};
  let got = 0;
  months.forEach((m) => { if (P[m]) got += 1; });
  const miss = months.length - got;
  return { got, miss, ok: miss === 0, owe: miss * (Number(rate) || 0), collected: got * (Number(rate) || 0) };
}

function duesTabHtml() {
  const L = state.list;
  const start = duesStart();
  const now = ymNow();
  const nB = Math.max(Number(L.blocks) || 1, ...state.hh.map((x) => x.block || 0));
  const scope = state.duesScope && state.duesScope <= nB ? state.duesScope : 0;
  const y0 = Number(start.slice(0, 4));
  const yN = lastYear();
  const year = state.duesYear >= y0 && state.duesYear <= yN ? state.duesYear : 0;
  const pool = scope ? state.hh.filter((h) => h.block === scope) : state.hh;

  const yearMonths = [];
  if (year) for (let i = 1; i <= 12; i++) { const m = `${year}-${pad2(i)}`; if (m >= start && m <= now) yearMonths.push(m); }
  const stat = (h) => {
    if (!year) { const c = duesCalc(h.paid, rateOf(h), start); return { ok: c.ok, n: c.behind, owe: c.balance }; }
    const c = periodCalc(h.paid, rateOf(h), yearMonths);
    return { ok: c.ok, n: c.miss, owe: c.owe, collected: c.collected };
  };
  const rows = pool.map((h) => ({ h, c: stat(h) }));
  const ok = rows.filter((x) => x.c.ok).length;
  const owe = rows.reduce((a, x) => a + x.c.owe, 0);
  const collected = rows.reduce((a, x) => a + (x.c.collected || 0), 0);
  const okLabel = year ? t('ovFull') : t('upToDate');
  const badLabel = year ? t('ovMissing') : t('behind');

  let chart1 = '';
  if (!scope) {
    const per = [];
    for (let b = 1; b <= nB; b++) {
      const hs = rows.filter((x) => x.h.block === b);
      if (!hs.length) continue;
      const okN = hs.filter((x) => x.c.ok).length;
      per.push({ b, n: hs.length, okN, bad: hs.length - okN });
    }
    const max = Math.max(1, ...per.map((x) => x.n));
    const tip = (x) => t('ovTipBlock', x.b, x.okN, x.n, okLabel);
    chart1 = `<div class="chart-card">
      <h3>${year ? t('ovByBlockY', year) : t('ovByBlock')}</h3>
      <div class="legend"><span><i style="background:var(--volt)"></i>${okLabel}</span><span><i style="background:var(--pink)"></i>${badLabel}</span></div>
      <div class="hbars">${per.map((x) => `<button class="hbar" data-act="duesScope" data-v="${x.b}" data-tip="${esc(tip(x))}" aria-label="${esc(tip(x))}">
        <span class="hb-l">${t('blkNo', x.b)}</span>
        <span class="hb-track"><span class="hb-fill" style="width:${(x.n / max) * 100}%">${x.okN ? `<i class="ok" style="flex:${x.okN}"></i>` : ''}${x.bad ? `<i class="warn" style="flex:${x.bad}"></i>` : ''}</span></span>
        <span class="hb-v">${x.okN}/${x.n}</span>
      </button>`).join('')}</div>
      <p class="readout" aria-live="polite">${t('ovTapBlock')}</p>
    </div>`;
  } else {
    const list = rows.slice().sort((a, b) => cmpHH(a.h, b.h));
    const max = Math.max(1, ...list.map((x) => x.c.n));
    const tip = (h, c) => `${t('blkShort', h.block, h.lot)}: ${h.name || t('blank')}. ${c.ok ? (year ? t('ovFullCap') : t('stOk')) : year ? t('ovUnpaidN', c.n) : t('stBehind', c.n)}${c.owe ? `, ₱${peso(c.owe)}` : ''}`;
    chart1 = `<div class="chart-card">
      <h3>${year ? t('ovPerHHY', scope, year) : t('ovPerHH', scope)}</h3>
      ${list.length ? `<div class="hbars">${list.map(({ h, c }) => `<button class="hbar" data-act="openHH" data-v="${h.id}" data-tip="${esc(tip(h, c))}" aria-label="${esc(tip(h, c))}">
        <span class="hb-l">${t('lotNo', h.lot)}<small>${esc(h.name || t('blank'))}</small></span>
        <span class="hb-track">${c.ok ? `<span class="hb-okchip">${year ? t('ovFullCap') : t('stOk')}</span>` : `<span class="hb-fill" style="width:${Math.max(4, (c.n / max) * 100)}%"><i class="warn" style="flex:1"></i></span>`}</span>
        <span class="hb-v">${c.ok ? '' : t('moShort', c.n)}</span>
      </button>`).join('')}</div>
      <p class="readout" aria-live="polite">${t('ovTapHH')}</p>` : `<p class="sub small">${t('noHH')}</p>`}
    </div>`;
  }

  const months = [];
  if (year) for (let i = 1; i <= 12; i++) months.push(`${year}-${pad2(i)}`);
  else for (let i = 11; i >= 0; i--) { const m = ymAdd(now, -i); if (m >= start) months.push(m); }
  const cols = months.map((m) => {
    const n = pool.filter((h) => (h.paid || {})[m]).length;
    return { m, n, pct: pool.length ? Math.round((n / pool.length) * 100) : 0, off: m < start || m > now };
  });
  const shown = cols.filter((x) => !x.off);
  const last = shown[shown.length - 1] || cols[cols.length - 1];
  const colTip = (x) => (x.off && !x.n ? `${fmtYm(x.m)}: ${t('lgFut')}` : t('ovTipMonth', fmtYm(x.m), x.n, pool.length, x.pct));
  const chart2 = pool.length && cols.length ? `<div class="chart-card">
    <h3>${year ? t('ovMonthlyY', year) : t('ovMonthly')}</h3>
    <div class="cols" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map((x) => `<button class="col ${x.off ? 'off' : ''}" data-tip="${esc(colTip(x))}" aria-label="${esc(colTip(x))}"><span class="col-bar" style="height:${Math.max(x.n ? 4 : 0, x.pct)}%"></span><span class="col-x">${t('months')[Number(x.m.slice(5)) - 1].slice(0, 1)}</span></button>`).join('')}</div>
    <p class="readout" aria-live="polite">${esc(colTip(last))}</p>
  </div>` : '';

  const years = [];
  for (let y = y0; y <= yN; y++) years.push(y);
  const behind = pool.map((h) => ({ h, c: duesCalc(h.paid, rateOf(h), start) })).filter((x) => !x.c.ok).sort((a, b) => b.c.behind - a.c.behind || cmpHH(a.h, b.h));
  const money = year
    ? `<div class="sticker"><b>${ok}/${rows.length}</b><span>${okLabel}</span></div><div class="sticker" title="₱${peso(collected)}"><b>₱${pesoShort(collected)}</b><span>${t('ovCollected')}</span></div><div class="sticker" title="₱${peso(owe)}"><b>₱${pesoShort(owe)}</b><span>${t('ovUnpaid')}</span></div>`
    : `<div class="sticker"><b>${ok}/${rows.length}</b><span>${okLabel}</span></div><div class="sticker"><b>${rows.length - ok}</b><span>${badLabel}</span></div><div class="sticker" title="₱${peso(owe)}"><b>₱${pesoShort(owe)}</b><span>${t('toCollect')}</span></div>`;

  return `<section class="sticker" style="padding:18px;display:grid;gap:18px">
    <h2>💰 ${t('duesH')}</h2>
    <div class="row">
      <div class="seg" role="group" style="flex:1 1 230px"><button data-act="duesScope" data-v="0" aria-pressed="${!scope}">${t('ovAll')}</button><button data-act="duesScope" data-v="${scope || 1}" aria-pressed="${!!scope}">${t('ovPer')}</button></div>
      ${scope ? `<select id="ov-blk" class="field" style="flex:1 1 120px;width:auto" aria-label="${esc(t('printWhich'))}">${Array.from({ length: nB }, (_, i) => `<option value="${i + 1}" ${i + 1 === scope ? 'selected' : ''}>${t('blockN', i + 1)}</option>`).join('')}</select>` : ''}
    </div>
    <div class="chips wrap years" role="group" aria-label="${esc(t('ovYear'))}"><button data-act="duesYear" data-v="0" aria-pressed="${!year}">${t('ovAllYears')}</button>${years.map((y) => `<button data-act="duesYear" data-v="${y}" aria-pressed="${year === y}">${y}</button>`).join('')}<button data-act="addYear" aria-label="${esc(t('addYear', yN + 1))}">${I.plus}${yN + 1}</button></div>
    <div class="money">${money}</div>
    ${chart1}
    ${chart2}
    <div class="admin-sec">
      <h3>${t('behindList')} (${behind.length})</h3>
      ${behind.length ? `<div class="stack">${behind.map(({ h, c }) => `<div class="row" style="flex-wrap:nowrap">${lotRow(h, false).replace('class="lotbtn"', 'class="lotbtn" style="flex:1"')}${h.phone ? `<a class="btn small alt" href="${esc(smsHref(h.phone, t('remindText', h.name || '', c.behind, c.balance ? peso(c.balance) : '')))}">${t('remind')}</a>` : ''}</div>`).join('')}</div>` : `<p class="sub small">${t('allGood')}</p>`}
    </div>
    <div class="admin-sec">
      <h3>${t('duesSettingsH')}</h3>
      <div class="info">
        <label>${t('duesStart')}<input id="d-start" class="field" type="month" value="${esc(start)}"></label>
        <label>${t('duesRate')}<input id="d-rate" class="field" inputmode="decimal" value="${esc(L.duesRate || '')}" placeholder="100"></label>
      </div>
      <button class="btn small alt" data-act="saveDuesSettings">${t('save')}</button>
    </div>
  </section>`;
}

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function openSeed(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(seed.s), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(seed.i) }, key, b64(seed.d));
  return JSON.parse(new TextDecoder().decode(plain));
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let q = false;
  const s = String(text || '').replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"' && s[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && s[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map((r) => r.map((c) => c.trim())).filter((r) => r.some(Boolean));
}

async function importRows(rows) {
  const existing = new Set(state.hh.map((h) => `${h.block}|${norm(h.lot)}`));
  const add = [];
  let skip = 0;
  rows.forEach((r) => {
    const block = parseInt(r.block, 10);
    const lot = String(r.lot || '').trim();
    if (!block || !lot) return;
    const k = `${block}|${norm(lot)}`;
    if (existing.has(k)) { skip += 1; return; }
    existing.add(k);
    add.push({ block, lot, name: String(r.name || '').trim(), address: r.address || '', fam: r.fam ? Number(r.fam) || null : null, indiv: r.indiv ? Number(r.indiv) || null : null, phone: r.phone || '', notes: '', certs: {}, paid: {}, rate: null, token: newToken() });
  });
  for (let i = 0; i < add.length; i += 200) {
    const batch = writeBatch(db);
    add.slice(i, i + 200).forEach((h) => {
      const ref = doc(collection(db, 'checklists', cid, 'households'));
      batch.set(ref, { ...h, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      batch.set(doc(db, 'duesView', h.token), viewData(h));
    });
    await batch.commit();
  }
  const maxB = Math.max(Number(state.list.blocks) || 1, ...add.map((h) => h.block));
  if (maxB !== Number(state.list.blocks)) await updateDoc(listRef(), { blocks: maxB, updatedAt: serverTimestamp() });
  return { n: add.length, skip };
}

const longDate = (iso) => { const p = isoParts(iso); return `${MONTHS_EN[p.m - 1]} ${p.d}, ${p.y}`; };

function numWords(n) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const under1000 = (x) => {
    const out = [];
    if (x >= 100) { out.push(ones[Math.floor(x / 100)], 'Hundred'); x %= 100; }
    if (x >= 20) { out.push(tens[Math.floor(x / 10)] + (x % 10 ? '-' + ones[x % 10] : '')); } else if (x) out.push(ones[x]);
    return out.join(' ');
  };
  n = Math.floor(Math.abs(n));
  if (!n) return 'Zero';
  const parts = [];
  [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand'], [1, '']].forEach(([v, w]) => {
    const c = Math.floor(n / v);
    if (c) { parts.push(under1000(c) + (w ? ' ' + w : '')); n %= v; }
  });
  return parts.join(' ');
}
function pesoWords(amount) {
  const whole = Math.floor(amount);
  const cents = Math.round((amount - whole) * 100);
  return `${numWords(whole)} Pesos${cents ? ` and ${numWords(cents)} Centavos` : ''} only (P${Number(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })})`;
}
const storeyWords = (n) => `(${n}) ${numWords(n).toUpperCase()}`;

function certDefaults(h, type) {
  const C = certCfg();
  const items = {};
  FEE_KEYS.forEach((k) => { items[k] = { on: false, amt: Number(C.fees[k]) || 0 }; });
  return { hon: 'Mr./Ms.', name: h.name || '', block: String(h.block || ''), lot: String(h.lot || ''), date: todayIso(), storeys: 2, items, payor: h.name || '', witness: C.witness };
}

function certFieldValues(f) {
  const p = isoParts(f.date);
  const total = FEE_KEYS.reduce((a, k) => a + (f.items[k].on ? Number(f.items[k].amt) || 0 : 0), 0);
  return {
    who: `${f.hon ? f.hon + ' ' : ''}${f.name || '________________'}`,
    name: f.name || 'FIRST NAME, LAST NAME',
    block: f.block || '__',
    lot: f.lot || '__',
    day: `${ordinal(p.d).replace(/(\d+)(\D+)/, '$1<sup>$2</sup>')}`,
    month: MONTHS_EN[p.m - 1],
    year: String(p.y),
    longdate: longDate(f.date),
    storeys: storeyWords(Math.max(1, Number(f.storeys) || 1)),
    amount: pesoWords(total),
    payor: f.payor || '',
    witness: f.witness || '',
    items: FEE_KEYS.map((k) => `<div class="rc-item ${f.items[k].on ? '' : 'unpaid'}"><span class="rc-box">${f.items[k].on ? '✓' : ''}</span><span class="rc-lbl">${esc(t('fee_' + k))}</span><span class="rc-amt">${peso(Number(f.items[k].amt) || 0)}</span></div>`).join(''),
  };
}

function mountCert() {
  const host = document.getElementById('certPaper');
  if (!host || !state.certDraft) return;
  const d = state.certDraft;
  if (d.html) host.innerHTML = d.html;
  else { host.innerHTML = paperHtml(host.dataset.type); applyCertFields(host, d.f); }
  const paper = host.querySelector('.paper');
  if (paper) {
    paper.setAttribute('contenteditable', 'true');
    paper.setAttribute('spellcheck', 'false');
  }
  fitCert();
}

function fitCert() {
  const host = document.getElementById('certPaper');
  const paper = host && host.querySelector('.paper');
  if (!paper) return;
  const wrap = host.parentElement;
  const s = Math.max(0.6, Math.min(1, wrap.clientWidth / paper.offsetWidth));
  paper.style.transform = `scale(${s})`;
  paper.style.transformOrigin = 'top left';
  host.style.width = Math.floor(paper.offsetWidth * s) + 'px';
  host.style.height = Math.ceil(paper.offsetHeight * s) + 'px';
}
window.addEventListener('resize', () => fitCert());

function saveCertHtml() {
  const host = document.getElementById('certPaper');
  if (host && state.certDraft) state.certDraft.html = host.innerHTML;
}

document.addEventListener('input', (e) => {
  const tg = e.target;
  if (tg.closest && tg.closest('#certPaper')) { saveCertHtml(); return; }
  if (!state.certDraft || !tg.closest || !tg.closest('.cert-ed')) return;
  const f = state.certDraft.f;
  if (tg.dataset.cf) f[tg.dataset.cf] = tg.value;
  else if (tg.dataset.ci) f.items[tg.dataset.ci].on = tg.checked;
  else if (tg.dataset.ca) f.items[tg.dataset.ca].amt = Number(String(tg.value).replace(/[^\d.]/g, '')) || 0;
  else return;
  const host = document.getElementById('certPaper');
  if (host) { applyCertFields(host, f); saveCertHtml(); }
  const tot = document.querySelector('[data-cf-total]');
  if (tot) tot.textContent = certFieldValues(f).amount;
});
document.addEventListener('change', (e) => {
  const tg = e.target;
  if (tg.dataset && (tg.dataset.ci || tg.dataset.cf === 'hon' || tg.dataset.cf === 'date')) tg.dispatchEvent(new Event('input', { bubbles: true }));
});

function printCert(type) {
  const host = document.getElementById('certPaper');
  const paper = host && host.querySelector('.paper');
  if (!paper) return;
  const copy = paper.cloneNode(true);
  copy.removeAttribute('contenteditable');
  copy.style.transform = '';
  copy.style.transformOrigin = '';
  let st = document.getElementById('pageCss');
  if (!st) { st = document.createElement('style'); st.id = 'pageCss'; document.head.appendChild(st); }
  st.textContent = `@media print { @page { size: ${type === 'membership' ? 'A4 landscape' : 'letter portrait'}; margin: 0; } #print { padding: 0 !important; } }`;
  const out = document.getElementById('print');
  out.innerHTML = '';
  out.appendChild(copy);
  const done = () => { st.textContent = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  const imgs = [...copy.querySelectorAll('img')];
  Promise.all(imgs.map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })))).then(() => setTimeout(() => window.print(), 60));
}

function resizeLogo(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 320 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.88));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

async function applySeedCert(x) {
  if (!x || Array.isArray(x) || !x.cert) return false;
  const patch = { updatedAt: serverTimestamp() };
  if (!state.list.cert) patch.cert = x.cert;
  if (!state.list.certLogo && x.logo) patch.certLogo = x.logo;
  if (Object.keys(patch).length === 1) return false;
  await updateDoc(listRef(), patch);
  return true;
}

async function markIssued(hid, type) {
  const h = hhById(hid);
  if (!h) return;
  const T = CERT_TYPES.find((x) => x.k === type);
  const issued = { ...(h.issued || {}), [type]: todayIso() };
  const patch = { issued };
  if (T && T.re) {
    const r = reqs().find((x) => T.re.test(x.name));
    if (r && !(h.certs || {})[r.id]) patch.certs = { ...(h.certs || {}), [r.id]: true };
  }
  try { await saveHH(h, patch, false); } catch { toast(t('notSaved')); }
}

  qGo: () => { const f = searchHH(state.q); if (f.length) { state.q = ''; go('h/' + f[0].id); } },
  tourSkip: () => endTour(),
  openBlock: (el) => go('b/' + el.dataset.v),
  openHH: (el) => go('h/' + el.dataset.v),
  addBlock: safe(async () => {
    const n = Math.max(Number(state.list.blocks) || 1, ...state.hh.map((x) => x.block || 0)) + 1;
    await updateDoc(listRef(), { blocks: n, updatedAt: serverTimestamp() });
    toast(t('blockAdded', n));
  }),
  startAdd: () => { state.adding = true; render(true); const el = document.getElementById('newLot'); if (el) el.focus(); },
  cancelAdd: () => { state.adding = false; blurAll(); render(true); },
  saveNewHH: safe(async () => {
    const r = route();
    const blk = r.block || (r.hid && hhById(r.hid) ? hhById(r.hid).block : null);
    const lot = val('newLot');
    if (!lot) { toast(t('needLot')); document.getElementById('newLot').focus(); return; }
    const name = val('newName');
    const ref = doc(collection(db, 'checklists', cid, 'households'));
    const h = { block: blk, lot, name, address: '', fam: null, indiv: null, phone: '', notes: '', certs: {}, paid: {}, rate: null, token: newToken() };
    const batch = writeBatch(db);
    batch.set(ref, { ...h, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    batch.set(doc(db, 'duesView', h.token), viewData(h));
    state.adding = false;
    blurAll();
    await batch.commit();
    toast(t('hhAdded', name || t('blkShort', blk, lot)));
    go('h/' + ref.id);
  }),
  saveInfo: safe(async (el) => {
    const h = hhById(el.dataset.v);
    if (!h) return;
    const num = (id) => { const v = val(id); return v === '' ? null : Math.max(0, parseInt(v, 10) || 0); };
    const patch = { name: val('f-name').slice(0, 80), address: val('f-addr').slice(0, 120), fam: num('f-fam'), indiv: num('f-ind'), block: Number(val('f-blk')) || h.block, lot: val('f-lot').slice(0, 20) || h.lot, phone: val('f-phone').slice(0, 20), notes: val('f-notes').slice(0, 500) };
    blurAll();
    await saveHH(h, patch, true);
    toast(t('infoSaved'));
  }),
  cert: safe(async (el) => {
    const h = hhById(el.dataset.h);
    const r = reqs().find((x) => x.id === el.dataset.v);
    if (!h || !r) return;
    const certs = { ...(h.certs || {}) };
    const on = !certs[r.id];
    if (on) certs[r.id] = true; else delete certs[r.id];
    await saveHH(h, { certs }, false);
    toast(on ? t('certOn', r.name) : t('certOff', r.name));
  }),
  pay: safe(async (el) => {
    const id = el.closest('[data-h]') ? el.closest('[data-h]').dataset.h : null;
    const h = hhById(id);
    if (!h) return;
    const ym = el.dataset.v;
    const paid = { ...(h.paid || {}) };
    const on = !paid[ym];
    if (on) paid[ym] = true; else delete paid[ym];
    await saveHH(h, { paid }, true);
    toast(on ? t('paid', fmtYm(ym)) : t('unpaid', fmtYm(ym)));
  }),
  payNext: safe(async (el) => {
    const h = hhById(el.dataset.v);
    if (!h) return;
    const paid = { ...(h.paid || {}) };
    let m = duesStart();
    for (let i = 0; paid[m] && i < 1200; i++) m = ymAdd(m, 1);
    paid[m] = true;
    await saveHH(h, { paid }, true);
    toast(t('paid', fmtYm(m)));
    const r = el.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top, 16);
  }),
  payUpTo: safe(async (el) => {
    const h = hhById(el.dataset.v);
    const to = val('f-upto');
    if (!h || !ymOk(to)) return;
    const paid = { ...(h.paid || {}) };
    for (let m = duesStart(), i = 0; m <= to && i < 1200; m = ymAdd(m, 1), i++) paid[m] = true;
    blurAll();
    await saveHH(h, { paid }, true);
    toast(t('upToDone', fmtYm(to)));
  }),
  saveRate: safe(async (el) => {
    const h = hhById(el.dataset.v);
    if (!h) return;
    const v = Number(val('f-rate').replace(/[^\d.]/g, '')) || null;
    blurAll();
    await saveHH(h, { rate: v }, true);
    toast(t('rateSaved'));
  }),
  copyView: (el) => { const h = hhById(el.dataset.v); if (h) copyText(viewUrl(h.token), t('linkCopied')); },
  qrView: (el) => { const h = hhById(el.dataset.v); if (h) openSheet(`<h2>${esc(t('blkShort', h.block, h.lot))}</h2><div class="qr-prev">${qrSvg(viewUrl(h.token))}<span>${esc(h.name || '')}</span></div><p class="sub small">${t('linkTip')}</p><button class="btn" data-act="closeSheet">${t('done')}</button>`); },
  askDelHH: (el) => { state.confirm = 'h:' + el.dataset.v; render(true); },
  cancelConfirm: () => { state.confirm = null; render(true); },
  delHH: safe(async (el) => {
    const h = hhById(el.dataset.v);
    if (!h) return;
    const batch = writeBatch(db);
    batch.delete(hRef(h.id));
    if (h.token) batch.delete(doc(db, 'duesView', h.token));
    state.confirm = null;
    await batch.commit();
    toast(t('hhDeleted'));
    go('b/' + h.block);
  }),
  saveDuesSettings: safe(async () => {
    const start = val('d-start');
    const rate = Number(val('d-rate').replace(/[^\d.]/g, '')) || 0;
    blurAll();
    await updateDoc(listRef(), { duesStart: ymOk(start) ? start : duesStart(), duesRate: rate, updatedAt: serverTimestamp() });
    state.list = { ...state.list, duesStart: ymOk(start) ? start : duesStart(), duesRate: rate };
    await syncAllViews();
    toast(t('duesSaved'));
  }),
  home: (el, e) => {
    e.preventDefault();
    closeSheet();
    state.q = '';
    if (cid && state.admin) go('blocks');
    else if (!cid && !duesToken && !inbox) render(true);
    else if (inbox || (cid && !state.list)) { location.href = el.getAttribute('href'); return; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  certType: (el) => { const r = route(); if (r.cert) go(`cert/${r.cert.hid}/${el.dataset.v}`); },
  certReset: () => { state.certDraft = null; render(true); },
  certPrint: (el) => {
    printCert(el.dataset.v);
    markIssued(el.dataset.h, el.dataset.v);
    toast(t('cfMarked'));
  },
  loadCertSeed: async () => {
    const pw = val('certPw');
    if (!pw || !seed) return;
    let raw;
    try { raw = await openSeed(pw); } catch { toast(t('badPw')); return; }
    try { await applySeedCert(raw); toast(t('settingsSaved')); } catch { toast(t('notSaved')); }
  },
  saveOfficers: safe(async () => {
    const g = (k) => val('of-' + k);
    const fees = {};
    FEE_KEYS.forEach((k) => { fees[k] = Number(g('fee-' + k).replace(/[^\d.]/g, '')) || 0; });
    const cert = { hoaName: g('hoaName'), hoaAddr: g('hoaAddr'), resAddr: g('resAddr'), office: g('office'), president: g('president'), vp: g('vp'), secretary: g('secretary'), treasurer: g('treasurer'), auditor: g('auditor'), witness: g('witness'), committees: (document.getElementById('of-committees') || {}).value || '', fees };
    blurAll();
    await updateDoc(listRef(), { cert, updatedAt: serverTimestamp() });
    toast(t('settingsSaved'));
  }),
  duesYear: (el) => { state.duesYear = Number(el.dataset.v) || 0; store.set('duesYear', state.duesYear ? String(state.duesYear) : ''); render(true); },
  addYear: safe(async () => {
    const y = lastYear() + 1;
    await updateDoc(listRef(), { duesEndYear: y, updatedAt: serverTimestamp() });
    state.list = { ...state.list, duesEndYear: y };
    toast(t('yearAdded', y));
    await syncAllViews();
  }),
  duesScope: (el) => { state.duesScope = Number(el.dataset.v) || 0; store.set('duesScope', state.duesScope ? String(state.duesScope) : ''); render(true); },
  openRow: (el) => { state.openRow = el.dataset.v; state.confirm = null; render(true); },
  closeRow: () => { state.openRow = null; state.confirm = null; blurAll(); render(true); },
  addReq: safe(async () => {
    const el = document.getElementById('newReq');
    const name = el.value.trim();
    if (!name) { el.focus(); return; }
    el.value = '';
    blurAll();
    await saveReqs([...reqs(), { id: rid(), name, note: '' }]);
    toast(t('reqAdded'));
  }),
  quickReq: safe(async (el) => {
    const name = el.dataset.v;
    if (reqs().some((r) => norm(r.name) === norm(name))) return;
    await saveReqs([...reqs(), { id: rid(), name, note: '' }]);
    toast(t('reqAdded'));
  }),
  reqMove: safe(async (el) => {
    const list = [...reqs()];
    const i = list.findIndex((r) => r.id === el.dataset.v);
    const j = i + Number(el.dataset.dir);
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    await saveReqs(list);
  }),
  askReq: (el) => { state.confirm = 'r:' + el.dataset.v; render(true); },
  delReq: safe(async (el) => {
    state.confirm = null;
    state.openRow = null;
    await saveReqs(reqs().filter((r) => r.id !== el.dataset.v));
    toast(t('reqDeleted'));
  }),
  copyAll: () => copyText(state.hh.map((h) => `${t('blkShort', h.block, h.lot)} ${h.name || ''}: ${viewUrl(h.token)}`).join('\n'), t('allCopied')),
  saveSettings: safe(async () => {
    const title = val('s-title') || state.list.title;
    const blocks = Math.max(1, Math.min(200, parseInt(val('s-blocks'), 10) || 1));
    const announcement = val('s-ann').slice(0, 200);
    blurAll();
    const titleChanged = title !== state.list.title;
    await updateDoc(listRef(), { title, blocks, announcement, updatedAt: serverTimestamp() });
    if (titleChanged) { state.list = { ...state.list, title }; await syncAllViews(); }
    toast(t('settingsSaved'));
  }),
  loadSeed: async (el) => {
    const pw = val('seedPw');
    if (!pw || !seed) return;
    const btn = document.querySelector('[data-act="loadSeed"]');
    if (btn) { btn.disabled = true; btn.textContent = t('importing'); }
    let rows;
    let raw;
    try {
      raw = await openSeed(pw);
      rows = Array.isArray(raw) ? raw : raw.h;
    } catch {
      if (btn) { btn.disabled = false; btn.textContent = t('loadBtn'); }
      toast(t('badPw'));
      return;
    }
    try {
      const res = await importRows(rows.map(([block, lot, name]) => ({ block, lot, name })));
      await applySeedCert(raw);
      toast(t('imported', res.n, res.skip));
      confetti(window.innerWidth / 2, 200, 40);
      go('blocks');
    } catch {
      if (btn) { btn.disabled = false; btn.textContent = t('loadBtn'); }
      toast(t('notSaved'));
    }
  },
  importCsv: safe(async () => {
    const f = document.getElementById('csvFile');
    let text = val('csvText');
    if (f && f.files && f.files[0]) text = await f.files[0].text();
    const rows = parseCsv(text);
    if (!rows.length) { toast(t('importNone')); return; }
    const head = rows[0].map((c) => norm(c));
    const hasHead = head.some((c) => /block|blk|lot|name|pangalan/.test(c));
    const idx = (keys, fallback) => { const i = head.findIndex((c) => keys.some((k) => c.includes(k))); return hasHead ? i : fallback; };
    const cB = idx(['block', 'blk'], 0);
    const cL = idx(['lot'], 1);
    const cN = idx(['name', 'pangalan'], 2);
    const cA = idx(['address'], -1);
    const cF = idx(['famil', 'pamilya'], -1);
    const cI = idx(['indiv', 'tao'], -1);
    const cP = idx(['mobile', 'phone', 'number'], -1);
    const data = (hasHead ? rows.slice(1) : rows).map((r) => ({ block: r[cB], lot: r[cL], name: cN >= 0 ? r[cN] : '', address: cA >= 0 ? r[cA] : '', fam: cF >= 0 ? r[cF] : '', indiv: cI >= 0 ? r[cI] : '', phone: cP >= 0 ? r[cP] : '' }));
    const res = await importRows(data);
    if (!res.n && !res.skip) { toast(t('importNone')); return; }
    toast(t('imported', res.n, res.skip));
    go('blocks');
  }),
  printCards: () => {
    const b = val('r-blk');
    const list = b ? state.hh.filter((h) => String(h.block) === b) : state.hh;
    printWith(`<div class="pr"><h1>${esc(state.list.title || t('defTitle'))}</h1><p>${esc(fmtDate(Date.now()))}</p></div>${list.map(printCardHtml).join('')}`);
  },
  csv: () => downloadCsv(),
  addEditor: safe(async () => {
    const email = val('edIn').toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast(t('badEmail')); return; }
    const editors = [...new Set([...(state.list.editors || []), email])];
    blurAll();
    await updateDoc(listRef(), { editors, updatedAt: serverTimestamp() });
    toast(t('teamAdded'));
  }),
  removeEditor: safe(async (el) => {
    const editors = (state.list.editors || []).filter((e) => e !== el.dataset.v);
    await updateDoc(listRef(), { editors, updatedAt: serverTimestamp() });
    toast(t('teamRemoved'));
  }),
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  const pos = e.target.selectionStart;
  render(true);
  const again = document.getElementById('q');
  if (again) { again.focus({ preventScroll: true }); try { again.setSelectionRange(pos, pos); } catch {} }
});

function showTip(e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) return;
  const box = el.closest('.chart-card');
  const out = box && box.querySelector('.readout');
  if (out) out.textContent = el.dataset.tip;
  if (box) box.querySelectorAll('[data-tip]').forEach((x) => x.classList.toggle('on', x === el));
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.enter) return;
  e.preventDefault();
  const fn = ACTIONS[e.target.dataset.enter];
  if (fn) fn(e.target, e);
});

document.addEventListener('change', async (e) => {
  const tg = e.target;
  if (tg.id === 'of-logo' && tg.files && tg.files[0]) {
    try { const url = await resizeLogo(tg.files[0]); await updateDoc(listRef(), { certLogo: url, updatedAt: serverTimestamp() }); toast(t('settingsSaved')); } catch { toast(t('notSaved')); }
    return;
  }
  if (tg.id === 'ov-blk') { state.duesScope = Number(tg.value) || 0; store.set('duesScope', String(state.duesScope)); tg.blur(); render(true); return; }
  if (!tg.dataset || !tg.dataset.rename) return;
  const name = tg.value.trim();
  if (!name) { render(true); return; }
  try {
    await saveReqs(reqs().map((r) => (r.id === tg.dataset.rename ? { ...r, name } : r)));
    toast(t('renamed'));
  } catch {
    toast(t('notSaved'));
  }
});

const tour = { i: -1, el: null };
function tourTargets() {
  return t('tourSteps').map(([sel, h, p]) => ({ el: [...document.querySelectorAll(sel)].find((x) => x.offsetParent !== null), h, p })).filter((x) => x.el);
}
function startTour() {
  if (!state.admin || sheetOpen()) return;
  if (!tourTargets().length) return;
  tour.i = -1;
  tourStep(0);
}
function endTour() {
  tour.i = -1;
  const el = document.getElementById('tour');
  if (el) el.remove();
  store.set('seenTour1', '1');
  store.set('seenGuide5', '1');
}
function tourStep(i) {
  const steps = tourTargets();
  if (i >= steps.length) { endTour(); return; }
  tour.i = i;
  const st = steps[i];
  st.el.scrollIntoView({ block: 'center', behavior: 'instant' });
  let box = document.getElementById('tour');
  if (!box) { box = document.createElement('div'); box.id = 'tour'; document.body.appendChild(box); }
  const last = i === steps.length - 1;
  box.innerHTML = `<div class="tour-hole"></div><div class="tour-tip" role="dialog" aria-live="polite">
    <small>${esc(t('tourOf', i + 1, steps.length))}</small><b>${st.h}</b><p>${st.p}</p>
    <div class="tour-acts">${last ? '' : `<button class="linkbtn" data-act="tourSkip">${t('tourSkip')}</button>`}<button class="btn small" data-act="tourNext">${last ? t('tourDone') : t('tourNext')}</button></div></div>`;
  placeTour();
}
function placeTour() {
  const box = document.getElementById('tour');
  if (!box || tour.i < 0) return;
  const st = tourTargets()[tour.i];
  if (!st) return;
  const r = st.el.getBoundingClientRect();
  const pad = 6;
  const hole = box.querySelector('.tour-hole');
  Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const tip = box.querySelector('.tour-tip');
  const w = Math.min(340, innerWidth - 24);
  tip.style.width = w + 'px';
  tip.style.left = Math.max(12, Math.min(innerWidth - w - 12, r.left + r.width / 2 - w / 2)) + 'px';
  const below = r.bottom + 14;
  const th = tip.offsetHeight;
  tip.style.top = (below + th < innerHeight - 8 ? below : Math.max(8, r.top - th - 14)) + 'px';
}
window.addEventListener('resize', placeTour);
window.addEventListener('scroll', placeTour, { passive: true });

const firstLook = setInterval(() => {
  if (!state.loaded || document.querySelector('#app .loading')) return;
  clearInterval(firstLook);
  setTimeout(() => {
    if (sheetOpen() || inbox) return;
    if (duesToken) { if (!store.get('seenGuide5')) openGuide('fam'); return; }
    const r = state.admin ? route() : null;
    if (r && !store.get('seenTour1') && r.tab === 'blocks' && !r.block && !r.hid && !r.cert) startTour();
    else if (state.admin && !store.get('seenGuide5')) openGuide('org');
  }, 900);
}, 300);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
</body>
</html>
