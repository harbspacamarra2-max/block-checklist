<style>
:root {
  --bg: #F4F0FF;
  --card: #FFFFFF;
  --soft: #ECE6FF;
  --ink: #1A1033;
  --edge: #1A1033;
  --drop: #1A1033;
  --sub: #5B4F7A;
  --faint: #8C80AD;
  --grape: #7C4DFF;
  --on-grape: #FFFFFF;
  --volt: #D4FF3A;
  --pink: #FF5FA2;
  --pink-ink: #C2185B;
  --sun: #FFC93C;
  --danger: #E5326B;
  --danger-soft: #FFE1EC;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #140B2A; --card: #21153F; --soft: #2C1D54; --ink: #F4F0FF; --edge: #B9A8F5; --drop: #05010F;
    --sub: #C3B8E6; --faint: #8C80AD; --grape: #9B78FF; --on-grape: #12082A; --pink: #FF7AB4; --pink-ink: #FF9CC8;
    --danger: #FF6B95; --danger-soft: #3E1530;
    color-scheme: dark;
  }
}
html.hc {
  --bg: #FFFFFF; --card: #FFFFFF; --soft: #EDEDED; --ink: #000000; --edge: #000000; --drop: #000000; --sub: #111111; --faint: #333333;
  --grape: #4B1FD1; --on-grape: #FFFFFF; --pink: #FF5FA2; --pink-ink: #8A0036; --danger: #B00020; --danger-soft: #FFE5EA;
  color-scheme: light;
}
html.hc body { background-image: none; }
html.big { zoom: 1.18; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--soft) 1.4px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; min-height: 100vh;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(110px, calc(env(safe-area-inset-bottom) + 96px)) max(16px, env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(28px, 7.4vw, 46px); line-height: 1.04; font-weight: 800; text-wrap: balance; overflow-wrap: break-word; }
h2 { font-size: 22px; font-weight: 800; line-height: 1.15; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--sub); }
.small { font-size: 14px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

.sticker { background: var(--card); border: 2.5px solid var(--edge); border-radius: var(--r-lg); box-shadow: 5px 5px 0 var(--drop); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; font-weight: 800; background: var(--grape); color: var(--on-grape); border: 2.5px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); white-space: nowrap; text-decoration: none; transition: transform 0.08s ease, box-shadow 0.08s ease; }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--drop); }
.btn.alt { background: var(--card); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.small { min-height: 42px; padding: 0 16px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.field { width: 100%; min-height: 52px; border-radius: var(--r-md); border: 2.5px solid var(--edge); background: var(--card); padding: 0 16px; }
.field::placeholder { color: var(--faint); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 180px; min-width: 0; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
.logo img { width: 36px; height: 36px; border-radius: 11px; border: 2.5px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); transform: rotate(-6deg); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; min-width: 42px; padding: 0 14px; border-radius: 999px; background: var(--card); color: var(--ink); border: 2.5px solid var(--edge); box-shadow: 3px 3px 0 var(--drop); font-weight: 800; font-size: 14px; transition: transform 0.08s, box-shadow 0.08s; }
.pill.icon { padding: 0; font-family: var(--display); font-size: 16px; }
.pill.sun { background: var(--sun); color: #1A1033; }
.pill:active { transform: translate(3px, 3px); box-shadow: none; }
.pill svg { width: 18px; height: 18px; }

.offline { padding: 12px 16px; border-radius: var(--r-md); background: var(--ink); color: var(--card); font-weight: 700; font-size: 14px; }

.hero { position: relative; padding: 22px 20px 20px; display: grid; gap: 16px; overflow: hidden; }
.hero-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.art { width: 86px; height: auto; margin: -4px -6px 0 0; cursor: pointer; }
html.big .art { display: none; }
html.big .hero-top { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 560px) { .art { width: 170px; } .hero { padding: 26px 26px 22px; } }
.quip { margin-top: 8px; font-weight: 600; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 2px solid var(--edge); font-size: 14px; font-weight: 700; background: var(--soft); }
.tag.y { background: var(--sun); color: #1A1033; }
.tag.dl { background: var(--pink); color: #1A1033; }

.battery { display: flex; align-items: center; }
.cell { position: relative; flex: 1; height: 54px; border: 2.5px solid var(--edge); border-radius: 16px; background: var(--card); overflow: hidden; padding: 4px; }
.fill { display: block; height: 100%; border-radius: 10px; background: repeating-linear-gradient(-45deg, var(--volt) 0 14px, #C3F02C 14px 28px); border: 2px solid #1A1033; transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
.fill.zero { border: 0; }
.blabel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
.blabel b { background: var(--card); color: var(--ink); padding: 2px 12px; border-radius: 999px; border: 2px solid var(--edge); }
.nub { width: 9px; height: 22px; background: var(--edge); border-radius: 0 6px 6px 0; }

.notice { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--r-md); background: var(--sun); color: #1A1033; border: 2.5px solid var(--edge); font-weight: 600; overflow-wrap: anywhere; }
.notice b { font-family: var(--display); font-size: 17px; }
.how { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-md); background: var(--volt); color: #1A1033; border: 2.5px solid var(--edge); font-weight: 600; }
.how .em { font-size: 26px; line-height: 1; flex: none; }

.sec { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; margin: 6px 2px -6px; }
.sec span { font-size: 14px; color: var(--sub); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.stat-wrap { display: grid; overflow: hidden; align-content: start; }
.stat-wrap.on { background: var(--pink); color: #1A1033; }
.stat { text-align: left; display: grid; gap: 10px; padding: 16px; width: 100%; }
.stat .name { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.count { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.count small { font-size: 16px; color: var(--sub); font-weight: 700; }
.stat-wrap.on .count small, .stat-wrap.on .hint { color: #1A1033; }
.bar { height: 14px; border-radius: 999px; border: 2px solid var(--edge); background: var(--soft); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--volt); border-right: 2px solid var(--edge); transition: width 0.6s ease; }
.bar > span.zero { border: 0; }
.hint { font-size: 14px; font-weight: 700; color: var(--pink-ink); }
.hint.ok { color: var(--sub); }
.info { text-align: left; padding: 10px 16px; border-top: 2px dashed var(--edge); font-weight: 800; font-size: 14px; color: var(--grape); }
.stat-wrap.on .info { color: #1A1033; }

.search { position: sticky; top: 10px; z-index: 6; display: block; }
.search input { padding-left: 48px; box-shadow: 4px 4px 0 var(--drop); }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--sub); }
.tools { display: grid; gap: 12px; scroll-margin-top: 14px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 2.5px solid var(--edge); background: var(--card); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--sub); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--edge); background: var(--card); font-weight: 700; font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.filterbar { display: flex; gap: 10px; align-items: center; padding: 8px 8px 8px 16px; border-radius: var(--r-md); background: var(--pink); color: #1A1033; border: 2.5px solid var(--edge); font-weight: 800; }

.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.fam { position: relative; display: grid; gap: 14px; padding: 16px; }
.fam.mine { border-color: var(--grape); box-shadow: 5px 5px 0 var(--grape); }
.fam-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; flex: 1 1 170px; }
.avatar { width: 46px; height: 46px; border-radius: 14px; border: 2.5px solid var(--edge); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; flex: none; color: #1A1033; }
.fam-name { font-family: var(--display); font-size: 21px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; letter-spacing: -0.02em; }
.fam-lot { color: var(--sub); font-size: 14px; font-weight: 600; }
.score { font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--edge); background: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.done-sticker { font-family: var(--display); font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: var(--sun); color: #1A1033; border: 2.5px solid var(--edge); box-shadow: 2px 2px 0 var(--drop); transform: rotate(4deg); white-space: nowrap; }
.fam-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; border: 2px solid var(--edge); background: var(--soft); }
.badge.gold { background: var(--sun); color: #1A1033; }
.ticks { display: flex; flex-wrap: wrap; gap: 10px; }
.tick { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; min-height: 48px; padding: 0 18px 0 8px; border-radius: 999px; border: 2.5px solid var(--edge); background: var(--card); font-weight: 700; font-size: 15px; box-shadow: 3px 3px 0 var(--drop); transition: transform 0.08s, box-shadow 0.08s, background 0.15s; text-align: left; }
.tick:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--drop); }
.tick .box { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--edge); display: grid; place-items: center; flex: none; background: var(--card); }
.tick .box svg { width: 17px; height: 17px; opacity: 0; transform: scale(0.3) rotate(-20deg); transition: opacity 0.15s, transform 0.3s cubic-bezier(0.3, 1.8, 0.5, 1); }
.tick[aria-pressed="true"] { background: var(--volt); color: #1A1033; border-color: #1A1033; }
.tick[aria-pressed="true"] .box { background: #1A1033; border-color: #1A1033; color: var(--volt); }
.tick[aria-pressed="true"] .box svg { opacity: 1; transform: none; }
.tick.held { cursor: not-allowed; }
.vtag { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #1A1033; color: var(--volt); }
.updated { font-size: 13px; color: var(--faint); font-weight: 600; }
.thisus { justify-self: start; font-size: 14px; font-weight: 800; color: var(--grape); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
.org-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 12px; border-top: 2px dashed var(--edge); }
.org-row .lbl { font-size: 13px; font-weight: 800; color: var(--sub); margin-right: 2px; }
.mini { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--edge); background: var(--card); font-size: 13px; font-weight: 800; }
.mini.on { background: var(--volt); color: #1A1033; }
.need-h { font-weight: 800; }
.need { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.need li { padding: 10px 12px; border-radius: 12px; background: var(--soft); border: 2px solid var(--edge); display: grid; gap: 2px; }
.need li span { color: var(--sub); font-size: 14px; font-weight: 600; }
.allset { padding: 12px; border-radius: 12px; background: var(--volt); color: #1A1033; font-weight: 800; border: 2px solid var(--edge); }

.chart { padding: 16px; display: grid; gap: 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); font-weight: 700; }

.empty { text-align: center; padding: 32px 18px; display: grid; gap: 8px; justify-items: center; }
.empty .icon { font-size: 44px; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--sub); font-size: 14px; font-weight: 600; padding: 4px 2px; }
.live { display: inline-flex; align-items: center; gap: 8px; }
.live i { width: 10px; height: 10px; border-radius: 50%; background: #2BD46A; border: 2px solid var(--edge); animation: blink 2.4s infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.linkbtn { color: var(--ink); font-weight: 800; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; padding: 8px 0; }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 15; display: inline-flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 20px 0 16px; border-radius: 999px; background: var(--grape); color: var(--on-grape); border: 2.5px solid var(--edge); box-shadow: 4px 4px 0 var(--drop); font-weight: 800; font-size: 16px; transition: transform 0.08s, box-shadow 0.08s; }
.fab svg { width: 22px; height: 22px; }
.fab:active { transform: translate(3px, 3px); box-shadow: none; }

.admin { display: grid; gap: 18px; padding: 0; overflow: hidden; scroll-margin-top: 14px; }
.admin-h { background: var(--grape); color: var(--on-grape); padding: 16px 18px; border-bottom: 2.5px solid var(--edge); display: grid; gap: 2px; }
.admin-h p { font-size: 14px; opacity: 0.9; font-weight: 600; overflow-wrap: anywhere; }
.admin-body { display: grid; gap: 26px; padding: 0 18px 18px; }
.admin-sec { display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: var(--r-md); background: var(--soft); border: 2px solid var(--edge); flex-wrap: wrap; }
.item .grow { overflow-wrap: anywhere; }
.item input.field { min-height: 42px; border-width: 2px; }
.item.col { display: grid; padding: 10px; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--edge); flex: none; font-size: 15px; text-decoration: none; color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.del { color: var(--danger); }
.iconbtn:disabled { opacity: 0.35; cursor: default; }
textarea.field { min-height: 110px; padding: 12px 16px; resize: vertical; line-height: 1.5; }
.link-box { overflow-wrap: anywhere; background: var(--soft); padding: 12px 14px; border-radius: var(--r-md); border: 2px dashed var(--edge); font-size: 14px; font-weight: 600; }
.tip { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--sub); font-weight: 600; background: var(--soft); border-radius: 12px; padding: 8px 12px; }
.log { display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
.log-item { display: grid; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; overflow-wrap: anywhere; }
.log-item small { color: var(--sub); font-weight: 600; }
.lists { display: grid; gap: 10px; }
.list-link { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-radius: var(--r-md); border: 2.5px solid var(--edge); background: var(--card); color: var(--ink); text-decoration: none; font-weight: 800; box-shadow: 3px 3px 0 var(--drop); }
.list-link small { color: var(--sub); font-weight: 600; }
details summary { list-style: none; }
details summary::-webkit-details-marker { display: none; }

.sheet-bg { position: fixed; inset: 0; background: rgba(20, 11, 42, 0.5); display: grid; align-items: end; justify-items: center; z-index: 20; padding: 16px; animation: fade 0.2s ease; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 22px; display: grid; gap: 14px; animation: up 0.25s ease; margin-bottom: env(safe-area-inset-bottom); }
.sheet > .btn:last-child { position: sticky; bottom: 0; box-shadow: 3px 3px 0 var(--drop), 0 -14px 14px var(--card); }
.sheet .ico { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); border: 2px solid var(--edge); vertical-align: middle; margin: 0 2px; }
.sheet .ico svg { width: 16px; height: 16px; }
.opt { display: grid; gap: 8px; }
.qr-prev { display: grid; justify-items: center; gap: 8px; padding: 14px; border-radius: var(--r-md); background: #FFFFFF; border: 2.5px solid var(--edge); color: #1A1033; text-align: center; font-weight: 700; }
.qr-prev svg { width: 200px; height: 200px; }
.big-msg { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; text-align: center; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: st; }
.steps li { position: relative; padding: 2px 0 2px 44px; min-height: 32px; counter-increment: st; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: #1A1033; border: 2px solid var(--edge); font-family: var(--display); font-weight: 800; }
.steps li.done::before { content: "✓"; background: var(--volt); }
.steps li.done { color: var(--sub); }
.extras { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.extras li { padding: 10px 12px; border-radius: 12px; background: var(--soft); border: 2px solid var(--edge); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 2.5px solid var(--edge); }
.tabs button { flex: 1; min-height: 40px; border-radius: 999px; font-weight: 800; font-size: 14px; color: var(--sub); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }

.toast { position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px); transform: translateX(-50%) translateY(260%); display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--card); padding: 12px 20px; border-radius: 999px; font-weight: 800; border: 2.5px solid var(--edge); box-shadow: 4px 4px 0 var(--pink); transition: transform 0.25s cubic-bezier(.2,1.4,.4,1), visibility 0.25s; visibility: hidden; z-index: 30; max-width: calc(100% - 32px); width: max-content; }
.toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
.toast .undo { color: var(--volt); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; padding: 4px 0; }
html.hc .toast .undo { color: #FFFFFF; }
.loading { display: grid; gap: 16px; }
.skel { height: 120px; border-radius: var(--r-lg); border: 2.5px solid var(--soft); background: var(--card); animation: blink 1.2s infinite; }
.confetti { position: fixed; width: 10px; height: 14px; border-radius: 3px; border: 1.5px solid #1A1033; pointer-events: none; z-index: 40; }

#print { display: none; }
.pr h1 { font-family: var(--display); font-size: 26px; margin: 0 0 4px; }
.pr p { margin: 0 0 12px; }
.pr table { width: 100%; border-collapse: collapse; font-size: 12px; }
.pr th, .pr td { border: 1px solid #000; padding: 5px 6px; text-align: left; vertical-align: top; }
.pr th { background: #EEEEEE; }
.pr td.c { text-align: center; font-weight: 800; }
.poster { text-align: center; display: grid; gap: 16px; justify-items: center; padding-top: 6mm; }
.poster h1 { font-size: 42px; line-height: 1.05; }
.poster .lead { font-size: 22px; font-weight: 700; }
.poster .qr svg { width: 95mm; height: 95mm; }
.poster ol { text-align: left; font-size: 19px; display: grid; gap: 6px; }
.poster .url { font-size: 13px; word-break: break-all; }
@media print {
  html.big { zoom: 1; }
  body { background: #FFFFFF !important; padding: 0 !important; color: #000; }
  body > :not(#print) { display: none !important; }
  #print { display: block !important; color: #000; }
  @page { margin: 14mm; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2600);
}

function confetti(x, y, amount = 30) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#D4FF3A', '#FFC93C', '#FF5FA2', '#7C4DFF', '#6EE7F9'];
  for (let i = 0; i < amount; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[i % colors.length];
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2;
    const d = 70 + Math.random() * 140;
    el.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 50}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: 0.6 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 90}px) rotate(${Math.random() * 900}deg)`, opacity: 0 },
    ], { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => el.remove();
  }
}

async function signIn() {
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = e && e.code;
    if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment' || code === 'auth/web-storage-unsupported') {
      await signInWithRedirect(auth, provider);
    } else if (code !== 'auth/popup-closed-by-user' && code !== 'auth/cancelled-popup-request') {
      toast(t('signInFail'));
    }
  }
}

async function loadMyLists() {
  const u = state.user;
  if (!u || state.myListsFor === u.uid) return;
  state.myListsFor = u.uid;
  state.myLists = null;
  try {
    const email = String(u.email || '').toLowerCase();

      getDocs(query(collection(db, 'checklists'), where('ownerUid', '==', u.uid))),
      email ? getDocs(query(collection(db, 'checklists'), where('editors', 'array-contains', email))) : Promise.resolve({ docs: [] }),
    ]);
    const map = new Map();

    state.myLists = [];

  done.slice(0, 3).forEach((f, i) => { m[f.id] = i; });

}

function chartHtml(F, R) {
  if (!F.length || !R.length) return '';
  const today = startOfDay(Date.now());
  const times = F.filter((f) => isComplete(f, R)).map((f) => millis(f.completedAt) || Date.now());
  const created = millis(state.list.createdAt) || today;
  const first = startOfDay(Math.min(created, today, ...times));
  const n = Math.min(21, Math.max(7, Math.round((today - first) / DAY) + 1));
  const start = today - (n - 1) * DAY;
  const days = Array.from({ length: n }, (_, i) => start + i * DAY);
  const counts = days.map((d) => times.filter((x) => x < d + DAY).length);
  const W = n * 24;
  const H = 120;
  const max = F.length;
  const bars = counts.map((c, i) => {
    const h = c ? Math.max(8, Math.round((c / max) * (H - 26))) : 3;
    const label = c && (i === n - 1 || c !== counts[i - 1]);
    return `<rect x="${i * 24 + 3}" y="${H - h}" width="18" height="${h}" rx="4" style="fill:${c ? 'var(--volt)' : 'var(--soft)'};stroke:var(--edge);stroke-width:2"/>${label ? `<text x="${i * 24 + 12}" y="${H - h - 6}" text-anchor="middle" style="fill:var(--ink);font:800 11px Figtree,sans-serif">${c}</text>` : ''}`;
  }).join('');
  return `<section class="sticker chart">
    <div><h2>${t('chartH')}</h2><span class="sub small">${times.length ? t('chartSub', times.length, max) : t('chartEmpty')}</span></div>
    <svg viewBox="0 0 ${W} ${H + 2}" role="img" aria-label="${esc(t('chartSub', times.length, max))}">${bars}</svg>
    <div class="axis"><span>${fmtDate(days[0]).replace(/ \d{4}$/, '')}</span><span>${t('today')}</span></div>
  </section>`;
}

  const groups = [...new Set(F.map((f) => String(f.group || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));

  const narrowed = words.length || state.filter || state.group || state.view !== 'all';

  if (state.filter) shown = shown.filter((f) => !has(f, { id: state.filter }));
  if (state.view === 'todo') shown = shown.filter((f) => !isComplete(f, R));
  if (state.view === 'done') shown = shown.filter((f) => isComplete(f, R));

        <div class="cell"><span class="fill ${pct ? '' : 'zero'}" style="width:${pct}%"></span><span class="blabel"><b>${t('battery', completeCount, F.length)}</b></span></div>
        <span class="nub"></span>
      </div>

function logTick(f, r, on) {

  }).catch(() => {});
}

function setTick(f, r, on, el, isUndo) {
  const R = reqs();
  const was = isComplete(f, R);
  const ticks = { ...(f.ticks || {}) };
  if (on) ticks[r.id] = true; else delete ticks[r.id];
  const now = R.length > 0 && R.every((x) => ticks[x.id]);
  const upd = { ['ticks.' + r.id]: on ? true : deleteField(), updatedAt: serverTimestamp() };
  if (now && !was) upd.completedAt = serverTimestamp();
  if (!now && was) upd.completedAt = deleteField();
  updateDoc(doc(db, 'checklists', cid, 'families', f.id), upd).catch(() => toast(t('notSaved')));
  logTick(f, r, on);
  if (now && !was && el) { const b = el.getBoundingClientRect(); confetti(b.left + b.width / 2, b.top + b.height / 2); }
  if (isUndo) { toast(t('undone')); return; }
  let msg;
  if (!navigator.onLine) msg = t('savedOffline');
  else if (now && !was) msg = pick(t('completeMsgs', f.name));
  else msg = pick(on ? t('tickOn') : t('tickOff'));
  if (on && !myFam && !state.admin) { myFam = f.id; store.set('myFam:' + cid, f.id); msg = t('pinned', f.name); }
  toast(msg, { label: t('undo'), fn: () => { const ff = famById(f.id); if (ff) setTick(ff, r, !on, null, true); } });
}

function checkMilestone() {
  const R = reqs();
  const F = state.families;
  if (!state.list || F.length < 2 || !R.length) return;
  const c = F.filter((f) => isComplete(f, R)).length;
  const key = 'ms:' + cid;
  const prev = Number(store.get(key) || 0);
  const hit = c === F.length ? 100 : c / F.length >= 0.5 ? 50 : 0;
  if (hit <= prev) return;
  store.set(key, String(hit));
  if (sheetOpen()) return;
  const w = window.innerWidth;
  [0.2, 0.5, 0.8].forEach((x, i) => setTimeout(() => confetti(w * x, window.innerHeight * 0.4, 40), i * 250));
  openSheet(`<div class="big-msg">${hit === 100 ? t('ms100') : t('ms50')}</div><p style="text-align:center">${hit === 100 ? t('ms100p') : t('ms50p')}</p><button class="btn" data-act="closeSheet">${t('yay')}</button>`);
}

function buildMessage(kind) {
  const R = reqs();
  const F = state.families;
  const L = state.list;
  const m = M();
  const url = shareUrl();
  const title = L.title || t('defTitle');
  const names = (list) => list.map((f) => f.name + (f.lot ? ` (${f.lot})` : '')).join(', ');
  const c = F.filter((f) => isComplete(f, R)).length;
  if (kind === 'update') {
    const lines = R.map((r) => {
      const without = F.filter((f) => !has(f, r));
      return m.line(!without.length, r.name, F.length - without.length, F.length) + (without.length ? '\n' + m.still(names(without)) : '');
    }).join('\n');
    return m.update(title, fmtDate(Date.now()), lines, url);
  }
  if (kind === 'remind') {
    const lines = R.map((r) => { const w = F.filter((f) => !has(f, r)); return w.length ? m.remindLine(r.name, names(w)) : ''; }).filter(Boolean).join('\n');
    return m.remind(title, lines || '✅', url);
  }
  if (kind === 'deadline') {
    if (!L.deadline) return null;
    const left = m.daysLeft(daysLeft(L.deadline));
    return m.deadline(title, fmtDate(isoToMs(L.deadline)), left, names(F.filter((f) => !isComplete(f, R))) || '✅', url);
  }
  return m.thanks(title, c, F.length, c === F.length && F.length > 0);
}

async function copyText(text, okMsg) {
  try {

    toast(okMsg);
  } catch {
    openSheet(`<textarea class="field" readonly style="min-height:220px">${esc(text)}</textarea><button class="btn" data-act="closeSheet">${t('done')}</button>`);
    const ta = document.querySelector('.sheet textarea');
    ta.focus();
    ta.select();
  }
}

function qrSvg(text) {
  if (!window.qrcode) return '';
  const q = window.qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

function downloadCsv() {
  const R = reqs();
  const F = state.families;
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [[t('rpFamily'), t('rpLot'), t('rpStreet'), ...R.map((r) => r.name), t('rpDone')]];
  F.forEach((f) => rows.push([f.name, f.lot || '', f.group || '', ...R.map((r) => (has(f, r) ? t('yes') : '')), isComplete(f, R) ? t('yes') : '']));
  const csv = '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = (String(state.list.title || 'ka-block').replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '') || 'ka-block') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    await signIn();
    setTimeout(() => { if (state.user && !state.admin) { store.set('openAdmin', ''); toast(t('notOrganizer')); } }, 1500);
  },
  create: async () => {
    if (!state.user) { await signIn(); return; }
    const title = val('newTitle') || t('defTitle');
    const ref = doc(collection(db, 'checklists'));
    try {
      await setDoc(ref, { title, ownerUid: state.user.uid, editors: [], requirements: [{ id: rid(), name: t('defReq1'), note: '' }, { id: rid(), name: t('defReq2'), note: '' }], deadline: '', announcement: '', createdAt: serverTimestamp(), updatedAt: serverTimestamp() });

  },
  tick: (el) => {

    if (!f || !r) return;
    if (!state.admin && f.locked) { toast(t('lockedToast')); return; }
    if (!state.admin && f.verified && f.verified[r.id]) { toast(t('verifiedToast')); return; }
    const on = !has(f, r);
    el.setAttribute('aria-pressed', String(on));
    setTick(f, r, on, el, false);
  },
  thisUs: (el) => { const f = famById(el.dataset.fam); if (!f) return; myFam = f.id; store.set('myFam:' + cid, f.id); state.q = ''; render(true); window.scrollTo({ top: 0, behavior: 'smooth' }); toast(t('pinned', f.name)); },
  notMine: () => { myFam = null; store.set('myFam:' + cid, ''); render(true); toast(t('unpinned')); },
  filter: (el) => {
    const id = el.dataset.req;
    state.filter = state.filter === id ? null : id;
    if (state.filter) { state.view = 'all'; state.q = ''; }
    render(true);
    if (state.filter) document.getElementById('famsTop').scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  clearFilter: () => { state.filter = null; render(true); },
  info: (el) => {
    const r = reqs().find((x) => x.id === el.dataset.req);
    if (!r) return;
    openSheet(`<h2>${esc(r.name)}</h2><h3>${t('howToGet').replace('ⓘ ', '')}</h3><p>${esc(r.note || t('noNote'))}</p><button class="btn" data-act="closeSheet">${t('gotIt')}</button>`);
  },
  view: (el) => { state.view = el.dataset.v; state.filter = null; render(true); },
  group: (el) => { state.group = el.dataset.v; render(true); },
  fab: () => {
    const q = document.getElementById('q');
    if (!q) return;
    q.focus({ preventScroll: true });
    document.getElementById('famsTop').scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  adminToggle: () => {
    state.adminOpen = !state.adminOpen;
    state.confirm = null;
    state.editing = null;
    state.contactEdit = null;
    render(true);
    if (state.adminOpen) document.querySelector('.admin').scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  copyLink: () => copyText(shareUrl(), t('linkCopied')),
  shareLink: () => navigator.share({ title: state.list.title, text: t('shareText'), url: shareUrl() }).catch(() => {}),
  msg: (el) => {
    const text = buildMessage(el.dataset.v);
    if (!text) { toast(t('needDeadline')); return; }
    copyText(text, t('msgCopied'));
  },
  qr: () => openSheet(`<h2>${t('posterTitle')}</h2><div class="qr-prev">${qrSvg(shareUrl())}<span>${esc(state.list.title || '')}</span></div><p class="sub small">${t('posterNote')}</p><button class="btn alt" data-act="printPoster">🖨️ ${t('posterPrint')}</button><button class="btn" data-act="closeSheet">${t('done')}</button>`),
  printPoster: () => { closeSheet(); printWith(posterHtml()); },
  printReport: () => printWith(reportHtml()),
  csv: () => downloadCsv(),
  saveNotice: safe(async () => {
    const deadline = val('dlIn');
    const announcement = val('annIn').slice(0, 200);
    blurAll();
    await updateDoc(listRef(), { deadline, announcement, updatedAt: serverTimestamp() });
    toast(t('noticeSaved'));
  }),
  clearDeadline: safe(async () => { await updateDoc(listRef(), { deadline: '', updatedAt: serverTimestamp() }); toast(t('noticeSaved')); }),
  saveTitle: safe(async () => {
    const title = val('titleIn');
    if (!title) return;
    blurAll();
    await updateDoc(listRef(), { title, updatedAt: serverTimestamp() });
    toast(t('nameSaved'));
  }),
  addReq: safe(async () => {
    const el = document.getElementById('newReq');
    const name = el.value.trim();
    if (!name) { el.focus(); return; }
    el.value = '';
    blurAll();
    await saveReqs([...reqs(), { id: rid(), name, note: '' }]);
    toast(t('reqAdded'));
  }),
  reqMove: safe(async (el) => {
    const list = [...reqs()];
    const i = list.findIndex((r) => r.id === el.dataset.req);
    const j = i + Number(el.dataset.dir);
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    await saveReqs(list);
  }),
  askReq: (el) => { state.confirm = 'r:' + el.dataset.req; render(true); },
  askFam: (el) => { state.confirm = 'f:' + el.dataset.fam; render(true); },
  cancel: () => { state.confirm = null; render(true); },
  delReq: safe(async (el) => {
    const id = el.dataset.req;
    state.confirm = null;
    if (state.filter === id) state.filter = null;
    await saveReqs(reqs().filter((r) => r.id !== id));
    toast(t('reqDeleted'));
  }),
  delFam: safe(async (el) => {
    const id = el.dataset.fam;
    state.confirm = null;
    await deleteDoc(famRef(id));
    if (state.contacts[id]) deleteDoc(doc(db, 'checklists', cid, 'contacts', id)).catch(() => {});
    toast(t('famDeleted'));
  }),
  famMove: safe(async (el) => {
    const F = state.families;
    const i = F.findIndex((f) => f.id === el.dataset.fam);
    const j = i + Number(el.dataset.dir);
    if (i < 0 || j < 0 || j >= F.length) return;
    const a = F[i];
    const b = F[j];
    let oa = a.order ?? i;
    let ob = b.order ?? j;
    if (oa === ob) { oa = i; ob = j; }
    const batch = writeBatch(db);
    batch.update(famRef(a.id), { order: ob });
    batch.update(famRef(b.id), { order: oa });
    await batch.commit();
  }),
  editFam: (el) => { state.editing = el.dataset.fam; state.contactEdit = null; render(true); const n = document.getElementById('ef-name'); if (n) n.focus(); },
  contact: (el) => { state.contactEdit = el.dataset.fam; state.editing = null; render(true); const n = document.getElementById('ec-phone'); if (n) n.focus(); },
  cancelEdit: () => { state.editing = null; state.contactEdit = null; blurAll(); render(true); },
  saveFam: safe(async (el) => {
    const id = el.dataset.fam;
    const name = val('ef-name');
    if (!name) return;
    const lot = val('ef-lot');
    const group = val('ef-group');
    state.editing = null;
    blurAll();
    await updateDoc(famRef(id), { name, lot, group });
    toast(t('famSaved'));
    render(true);
  }),
  saveContact: safe(async (el) => {
    const id = el.dataset.fam;
    const phone = val('ec-phone');
    blurAll();
    if (phone) await setDoc(doc(db, 'checklists', cid, 'contacts', id), { phone });
    else await deleteDoc(doc(db, 'checklists', cid, 'contacts', id));
    toast(t('phoneSaved'));
    render(true);
  }),
  addFam: safe(async () => {
    const name = val('famName');
    if (!name) { document.getElementById('famName').focus(); return; }
    const lot = val('famLot');
    const group = val('famGroup');
    ['famName', 'famLot'].forEach((id) => { document.getElementById(id).value = ''; });
    blurAll();
    const last = state.families.reduce((m, f) => Math.max(m, f.order ?? 0), 0);
    await addDoc(collection(db, 'checklists', cid, 'families'), { name, lot, group, ticks: {}, order: Math.max(Date.now(), last + 1), updatedAt: serverTimestamp() });
    toast(t('famAdded', name));
  }),
  bulk: safe(async () => {
    const box = document.getElementById('bulk');
    const lines = box.value.split('\n').map((l) => l.trim()).filter(Boolean);
    if (!lines.length) { box.focus(); return; }
    box.value = '';
    blurAll();
    const base = Math.max(Date.now(), state.families.reduce((m, f) => Math.max(m, f.order ?? 0), 0) + 1);
    for (let start = 0; start < lines.length; start += 400) {
      const batch = writeBatch(db);
      lines.slice(start, start + 400).forEach((l, i) => {
        const [name, lot = '', ...rest] = l.split(',').map((s) => s.trim());
        batch.set(doc(collection(db, 'checklists', cid, 'families')), { name: name.slice(0, 50), lot: lot.slice(0, 20), group: rest.join(', ').slice(0, 30), ticks: {}, order: base + start + i, updatedAt: serverTimestamp() });
      });
      await batch.commit();
    }
    toast(t('bulkAdded', lines.length));
  }),
  verify: safe(async (el) => {
    const f = famById(el.dataset.fam);
    const id = el.dataset.req;
    if (!f) return;
    const on = !(f.verified && f.verified[id]);
    await updateDoc(famRef(f.id), { ['verified.' + id]: on ? true : deleteField() });
    toast(on ? t('verified') : t('unverified'));
  }),
  lock: safe(async (el) => {
    const f = famById(el.dataset.fam);
    if (!f) return;
    await updateDoc(famRef(f.id), { locked: !f.locked });
    toast(f.locked ? t('unlocked') : t('locked'));
  }),
  addEditor: safe(async () => {
    const email = val('edIn').toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast(t('badEmail')); return; }
    const editors = [...new Set([...(state.list.editors || []), email])];
    blurAll();
    await updateDoc(listRef(), { editors, updatedAt: serverTimestamp() });
    toast(t('teamAdded'));
  }),
  removeEditor: safe(async (el) => {
    const editors = (state.list.editors || []).filter((e) => e !== el.dataset.v);
    await updateDoc(listRef(), { editors, updatedAt: serverTimestamp() });
    toast(t('teamRemoved'));
  }),
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  const pos = e.target.selectionStart;
  render(true);
  const again = document.getElementById('q');
  if (again) { again.focus({ preventScroll: true }); try { again.setSelectionRange(pos, pos); } catch {} }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.enter) return;
  e.preventDefault();
  const fn = ACTIONS[e.target.dataset.enter];
  if (fn) fn(e.target, e);
});

document.addEventListener('change', async (e) => {
  const tg = e.target;
  const d = tg.dataset || {};
  if (!d.rename && !d.note) return;
  try {
    if (d.rename) {
      const name = tg.value.trim();
      if (!name) { render(true); return; }
      await saveReqs(reqs().map((r) => (r.id === d.rename ? { ...r, name } : r)));
      toast(t('renamed'));
    } else {
      await saveReqs(reqs().map((r) => (r.id === d.note ? { ...r, note: tg.value.trim().slice(0, 160) } : r)));
      toast(t('noticeSaved'));
    }
  } catch {
    toast(t('notSaved'));
  }
});

document.addEventListener('toggle', (e) => { if (e.target.id === 'bulkBox') state.bulkOpen = e.target.open; }, true);

setInterval(() => { if (state.families.some((f) => f.updatedAt)) render(); }, 60000);

const firstLook = setInterval(() => {
  if (!state.loaded || document.querySelector('#app .loading')) return;
  clearInterval(firstLook);
  setTimeout(() => {
    if (sheetOpen()) return;
    if (!store.get('seenGuide')) openGuide(cid && state.list && !state.admin ? 'fam' : 'org');
    else if (!store.get('seenNew2')) openWhatsNew();
  }, 700);
}, 300);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
</script>
</body>
</html>
